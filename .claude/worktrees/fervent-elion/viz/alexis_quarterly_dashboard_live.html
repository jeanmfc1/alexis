function exportCSV(rows) {
  const headers = ["sponsor_name","new_trial_count","modalities","top_phase","priority_score","priority_label"];
  const lines = [
    headers.join(","),
    ...rows.map(r => [
      `"${r.sponsor_name}"`,
      r.new_trial_count,
      `"${(r.modalities||[]).join("; ")}"`,
      r.top_phase || "",
      r.priority_score,
      r.priority_label,
    ].join(","))
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bd_wq1_sponsor_action_table.csv";
  a.click();
}

function WQ1ActionTable({ data, color }) {
  const [expanded, setExpanded]   = useState({});
  const [sortCol, setSortCol]     = useState("priority_score");
  const [sortDir, setSortDir]     = useState(-1);  // -1 desc, +1 asc

  const rows = useMemo(() => {
    if (!data?.length) return [];
    return [...data].sort((a, b) => {
      const av = a[sortCol] ?? 0;
      const bv = b[sortCol] ?? 0;
      if (typeof av === "string") return sortDir * av.localeCompare(bv);
      return sortDir * (av - bv);
    });
  }, [data, sortCol, sortDir]);

  if (!data?.length) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)", padding:"20px 0" }}>

        Verify that the enriched file was loaded and matches this snapshot window.
      </span>
    </div>
  );

  const toggleSort = col => {
    if (sortCol === col) setSortDir(d => d * -1);
    else { setSortCol(col); setSortDir(-1); }
  };

  const TH = ({ col, label, align = "left", width }) => {
    const active = sortCol === col;
    return (
      <th onClick={() => toggleSort(col)}
        style={{ padding:"8px 12px", textAlign:align,
          fontFamily:"var(--fm)", fontSize:10, letterSpacing:"0.12em",
          color: active ? color.mid : "var(--muted)",
          cursor:"pointer", whiteSpace:"nowrap", userSelect:"none",
          width: width || "auto",
          borderBottom:`2px solid ${active ? color.accent : "var(--border)"}` }}>

    );
  };

  const totalNew = rows.reduce((s, r) => s + r.new_trial_count, 0);

  return (
    <div>
      {/* Summary line + export */}
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14 }}>
        <MonoLabel style={{ marginBottom:0 }}>
          {rows.length} sponsors · {totalNew} new trials this window
        </MonoLabel>
        <div style={{ flex:1 }} />
        <button onClick={() => exportCSV(rows)}
          style={{ fontFamily:"var(--fm)", fontSize:10, padding:"4px 12px",
            background:"transparent", border:"1px solid var(--border2)",
            borderRadius:4, color:"var(--muted)", cursor:"pointer",
            letterSpacing:"0.1em" }}>
          EXPORT CSV
        </button>
      </div>

      {/* Priority legend */}
      <div style={{ display:"flex", gap:14, marginBottom:14, alignItems:"center" }}>
        {Object.entries(PRIORITY_CFG).map(([lbl, cfg]) => (
          <div key={lbl} style={{ display:"flex", alignItems:"center", gap:5 }}>
            <div style={{ width:8, height:8, borderRadius:2,
              background:cfg.color, opacity:0.8 }} />
            <span style={{ fontFamily:"var(--fm)", fontSize:10,
              color:cfg.color, letterSpacing:"0.08em" }}>
              {lbl}
            </span>
          </div>
        ))}
        <span style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--dim)" }}>
          score = Σ modality_weight × phase_weight per trial
        </span>
      </div>

      {/* Table */}
      <div style={{ overflowX:"auto", maxHeight:840, overflowY:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse" }}>
          <thead style={{ position:"sticky", top:0, zIndex:1 }}>
            <tr style={{ background:"var(--surf2)" }}>
              <TH col="sponsor_name"    label="SPONSOR" />
              <TH col="new_trial_count" label="NEW"    align="right" width={56} />
              <th style={{ padding:"8px 12px", fontFamily:"var(--fm)", fontSize:10,
                letterSpacing:"0.12em", color:"var(--muted)", textAlign:"left",
                borderBottom:"2px solid var(--border)" }}>
                MODALITY MIX
              </th>
              <TH col="top_phase"      label="TOP PHASE" width={100} />
              <TH col="priority_score" label="SCORE"   align="right" width={72} />
              <th style={{ padding:"8px 12px", fontFamily:"var(--fm)", fontSize:10,
                letterSpacing:"0.12em", color:"var(--muted)",
                borderBottom:"2px solid var(--border)", width:90 }}>
                PRIORITY
              </th>
              <th style={{ width:28, borderBottom:"2px solid var(--border)" }} />
            </tr>
          </thead>
          <tbody>
            {rows.map((row, i) => {
              const isOpen = !!expanded[row.sponsor_name];
              const pri    = PRIORITY_CFG[row.priority_label] || PRIORITY_CFG.LOW;
              return (
                <React.Fragment key={row.sponsor_name}>

                  {/* Main row */}
                  <tr onClick={() => setExpanded(e => ({
                        ...e, [row.sponsor_name]: !isOpen }))}
                    style={{ cursor:"pointer",
                      background: isOpen ? "var(--surf3)"
                        : i % 2 === 0 ? "var(--surf)" : "transparent",
                      borderTop:"1px solid var(--border)" }}>

                    <td style={{ padding:"10px 12px", fontFamily:"var(--fm)",
                      fontSize:12, color:"var(--text)",
                      maxWidth:260, overflow:"hidden",
                      textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                      {row.sponsor_name}
                    </td>

                    <td style={{ padding:"10px 12px", textAlign:"right",
                      fontFamily:"var(--fm)", fontSize:15, fontWeight:600,
                      color:color.mid }}>
                      {row.new_trial_count}
                    </td>

                    <td style={{ padding:"10px 12px" }}>
                      <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                        {(row.modalities||[]).slice(0,3).map(mod => (
                          <span key={mod} style={{ fontFamily:"var(--fm)", fontSize:10,
                            padding:"2px 6px", borderRadius:8,
                            background:modColor(mod)+"20", color:modColor(mod),
                            border:`1px solid ${modColor(mod)}30` }}>
                            {humanMod(mod)}
                          </span>
                        ))}
                        {(row.modalities||[]).length > 3 && (
                          <span style={{ fontFamily:"var(--fm)", fontSize:10,
                            color:"var(--muted)" }}>
                            +{row.modalities.length - 3}
                          </span>
                        )}
                      </div>
                    </td>

                    <td style={{ padding:"10px 12px", fontFamily:"var(--fm)",
                      fontSize:12, color:"var(--muted)" }}>
                      {row.top_phase || "—"}
                    </td>

                    <td style={{ padding:"10px 12px", textAlign:"right",
                      fontFamily:"var(--fm)", fontSize:12, color:"var(--text)" }}>
                      {row.priority_score}
                    </td>

                    <td style={{ padding:"10px 12px" }}>
                      <span style={{ fontFamily:"var(--fm)", fontSize:10,
                        fontWeight:600, padding:"3px 10px", borderRadius:10,
                        color:pri.color, background:pri.bg,
                        border:`1px solid ${pri.border}` }}>
                        {row.priority_label}
                      </span>
                    </td>

                    <td style={{ padding:"10px 8px", color:"var(--muted)",
                      fontSize:12, textAlign:"center",
                      transition:"transform 0.15s",
                      transform: isOpen ? "rotate(180deg)" : "none" }}>
                      ▾
                    </td>
                  </tr>

                  {/* Expanded trial list */}
                  {isOpen && (() => {
                    const ss = subSort[row.sponsor_name] || { col:"nct_id", dir:1 };
                    const toggleSubSort = col => {
                      setSubSort(prev => {
                        const cur = prev[row.sponsor_name] || { col:"nct_id", dir:1 };
                        return { ...prev, [row.sponsor_name]:
                          cur.col === col ? { col, dir: cur.dir * -1 } : { col, dir: -1 }
                        };
                      });
                    };
                    const sortedTrials = [...(row.trials||[])].sort((a, b) => {
                      let av = a[ss.col] ?? "";
                      let bv = b[ss.col] ?? "";
                      if (typeof av === "object") av = JSON.stringify(av);
                      if (typeof bv === "object") bv = JSON.stringify(bv);
                      if (typeof av === "string") return ss.dir * av.localeCompare(bv);
                      return ss.dir * (av - bv);
                    });

                    const SUB_COLS = [
                      { col:"nct_id",           label:"NCT ID",       width:120 },
                      { col:"title",            label:"TITLE",        width:340 },
                      { col:"overall_status",   label:"STATUS",       width:130 },
                      { col:"modality",         label:"MODALITY",     width:120 },
                      { col:"modality_source",  label:"MOD. EVIDENCE",width:140 },
                      { col:"therapeutic_area", label:"TA",           width:160 },
                      { col:"ta_evidence",      label:"TA EVIDENCE",  width:200 },
                      { col:"phase",            label:"PHASE",        width:90  },
                      { col:"first_posted_date",label:"1ST POSTED",   width:100 },
                    ];

                    // Status color coding — active statuses are normal,
                    // inactive ones are flagged so BD team knows not to pursue
                    const STATUS_COLORS = {
                      RECRUITING:               "var(--green)",
                      ENROLLING_BY_INVITATION:   "var(--green)",
                      ACTIVE_NOT_RECRUITING:     "var(--amber)",
                      NOT_YET_RECRUITING:        "var(--muted)",
                      COMPLETED:                 "var(--red)",
                      TERMINATED:                "var(--red)",
                      WITHDRAWN:                 "var(--red)",
                      SUSPENDED:                 "var(--red)",
                    };
                    const statusColor = s => STATUS_COLORS[s] || "var(--muted)";
                    const humanStatus = s => (s||"—").replace(/_/g," ").toLowerCase()
                      .replace(/\b\w/g, c => c.toUpperCase());

                    return (
                    <tr style={{ background:"var(--surf3)" }}>
                      <td colSpan={7} style={{ padding:"0 12px 14px 36px", maxWidth:0 }}>
                        <div style={{ overflowX:"auto" }}>
                        <table style={{ minWidth:1400, borderCollapse:"collapse" }}>
                          <thead>
                            <tr>
                              {SUB_COLS.map(h => {
                                const active = ss.col === h.col;
                                return (
                                  <th key={h.col} onClick={() => toggleSubSort(h.col)}
                                    style={{ padding:"6px 8px", textAlign:"left",
                                      fontFamily:"var(--fm)", fontSize:9,
                                      color: active ? color.mid : "var(--dim)",
                                      letterSpacing:"0.12em", cursor:"pointer",
                                      userSelect:"none", whiteSpace:"nowrap",
                                      width: h.width,
                                      borderBottom:`1px solid ${active ? color.accent : "var(--border)"}` }}>
                                    {h.label}{active ? (ss.dir === -1 ? " ↓" : " ↑") : ""}
                                  </th>
                                );
                              })}
                            </tr>
                          </thead>
                          <tbody>
                            {sortedTrials.map((t, ti) => {
                              const dead = ["COMPLETED","TERMINATED","WITHDRAWN","SUSPENDED"]
                                .includes(t.overall_status);
                              return (
                              <tr key={t.nct_id || ti}
                                style={{ borderTop:"1px solid var(--border)",
                                  opacity: dead ? 0.55 : 1 }}>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--cyan)", whiteSpace:"nowrap" }}>
                                  <a href={`https://clinicaltrials.gov/expert-search?term=${t.nct_id}`}
                                     target="_blank" rel="noopener noreferrer"
                                     style={{ color:"var(--cyan)", textDecoration:"none" }}
                                     onMouseOver={e => e.target.style.textDecoration="underline"}
                                     onMouseOut={e  => e.target.style.textDecoration="none"}>
                                    {t.nct_id}
                                  </a>
                                </td>
                                <td style={{ padding:"5px 8px", fontSize:12,
                                  color:"var(--text)", maxWidth:340,
                                  overflow:"hidden", textOverflow:"ellipsis",
                                  whiteSpace:"nowrap" }}
                                  title={t.title}>
                                  {t.title}
                                </td>
                                <td style={{ padding:"5px 8px" }}>
                                  <span style={{ fontFamily:"var(--fm)", fontSize:10,
                                    padding:"2px 6px", borderRadius:8,
                                    color: statusColor(t.overall_status),
                                    background: statusColor(t.overall_status) + "18",
                                    border: `1px solid ${statusColor(t.overall_status)}30`,
                                    whiteSpace:"nowrap" }}>
                                    {humanStatus(t.overall_status)}
                                  </span>
                                </td>
                                <td style={{ padding:"5px 8px" }}>
                                  <span style={{ fontFamily:"var(--fm)", fontSize:10,
                                    padding:"2px 6px", borderRadius:8,
                                    background:modColor(t.modality)+"20",
                                    color:modColor(t.modality) }}>
                                    {humanMod(t.modality)}
                                  </span>
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:10,
                                  color:"var(--dim)", whiteSpace:"nowrap" }}>
                                  {(t.modality_source || "—").replace(/_/g," ")}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--muted)", whiteSpace:"nowrap" }}>
                                  {t.therapeutic_area || "—"}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:10,
                                  color:"var(--dim)", maxWidth:200,
                                  overflow:"hidden", textOverflow:"ellipsis",
                                  whiteSpace:"nowrap" }}
                                  title={Array.isArray(t.ta_evidence) ? t.ta_evidence.join("; ") : (t.ta_evidence || "")}>
                                  {Array.isArray(t.ta_evidence) ? t.ta_evidence.join("; ") : (t.ta_evidence || "—")}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--muted)" }}>
                                  {t.phase || "—"}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--muted)", whiteSpace:"nowrap" }}>
                                  {t.first_posted_date || "—"}
                                </td>
                              </tr>
                              );
                            })}
                          </tbody>
                        </table>
                        </div>
                      </td>
                    </tr>
                    );
                  })()}

                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────
// viz/mk_wq1.jsx
// Marketing / wq1 — Social-Ready Stat Cards
//
// Data source : ALEXIS_DATA.wq4  (list of 4 card objects)
// Injected by : analytics/mk_wq1.py → wq4_social_stat_cards()
//
// Each card: { id, title, value, sub, detail:[{label,value,pct?}], note }
// Designed to be screenshot-ready: large value, clean breakdown rows.
// ─────────────────────────────────────────────────────────────────────────

function WQ4StatCards({ data, color }) {
  if (!data?.length) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)",
      padding:"20px 0" }}>
      No summary data available. Verify snapshot was built with summary_v2.py.
    </div>
  );

  // Card 2 (Top TA) has a long string value — shrink font for it
  const valueFontSize = c => c.id === "mk_wq1_c2" ? 18 : 32;

  return (
    <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:14 }}>
      {data.map(card => (
        <div key={card.id}
          style={{ background:"var(--surf2)", borderRadius:10,
            border:`1px solid ${color.accent}22`,
            padding:"20px 22px", display:"flex", flexDirection:"column", gap:12 }}>

          {/* Card header */}
          <div>
            <div style={{ fontFamily:"var(--fm)", fontSize:9,
              color:color.mid, letterSpacing:"0.16em",
              textTransform:"uppercase", marginBottom:6 }}>
              {card.title}
            </div>
            <div style={{ fontFamily:"var(--fh)", fontSize:valueFontSize(card),
              fontWeight:700, color:"var(--text)", lineHeight:1.1,
              letterSpacing:"0.01em" }}>
              {card.value}
            </div>
            <div style={{ fontFamily:"var(--fm)", fontSize:11,
              color:"var(--muted)", marginTop:4 }}>
              {card.sub}
            </div>
          </div>

          {/* Detail rows with mini bar */}
          {card.detail?.length > 0 && (
            <div style={{ borderTop:`1px solid ${color.accent}18`,
              paddingTop:10, display:"flex", flexDirection:"column", gap:6 }}>
              {card.detail.map((row, i) => {
                const maxVal = Math.max(...card.detail.map(r => r.value));
                const barPct = maxVal > 0 ? (row.value / maxVal) * 100 : 0;
                return (
                  <div key={i}>
                    <div style={{ display:"flex", justifyContent:"space-between",
                      marginBottom:3 }}>
                      <span style={{ fontFamily:"var(--fm)", fontSize:11,
                        color:"var(--text)" }}>
                        {humanMod(row.label)}
                      </span>
                      <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                        <span style={{ fontFamily:"var(--fm)", fontSize:11,
                          fontWeight:600, color:"var(--text)" }}>
                          {fmt(row.value)}
                        </span>
                        {row.pct != null && (
                          <span style={{ fontFamily:"var(--fm)", fontSize:10,
                            color:"var(--muted)", minWidth:36, textAlign:"right" }}>
                            {row.pct}%
                          </span>
                        )}
                      </div>
                    </div>
                    {/* Mini bar */}
                    <div style={{ height:3, background:"var(--border)", borderRadius:2 }}>
                      <div style={{ width:`${barPct}%`, height:"100%",
                        background:color.accent, borderRadius:2, opacity:0.6 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Note */}
          <div style={{ fontFamily:"var(--fm)", fontSize:9,
            color:"var(--dim)", marginTop:"auto", letterSpacing:"0.06em" }}>
            {card.note}
          </div>
        </div>
      ))}
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────
// viz/sci_wq1.jsx
// Scientific / wq1 — TA × Modality Bubble Matrix
//
// Data source : ALEXIS_DATA.wq7  (matrix dict)
// Injected by : analytics/sci_wq1.py → wq7_ta_modality_matrix()
// ─────────────────────────────────────────────────────────────────────────

const MODALITY_ABBR = {
  small_molecule:"SM", biologic:"Bio", monoclonal_antibody:"mAb",
  mab:"mAb", antibody_drug_conjugate:"ADC", adc:"ADC",
  gene_therapy:"GT", cell_therapy:"CT", cell_gene_therapy:"CGT",
  radiopharmaceutical:"Radio", oligonucleotide:"Oligo", peptide:"Pep",
  vaccine:"Vax", combination:"Combo", antibody_protein:"Ab/Pr",
  fusion_protein:"Fusion", other_drug:"Other",
};

function parseMasterDbLabel(filename) {
  if (!filename) return "master DB";
  const m = filename.match(/(\d{4})[_\s]?(Q\d)/i);
  if (m) return `${m[1]} ${m[2].toUpperCase()}`;
  const m2 = filename.match(/(\d{4})/);
  return m2 ? m2[1] : filename.replace(/\.json$/, "").replace(/master_DB_?/i, "");
}

function heatToColor(heat) {
  if (heat === null || heat === undefined) {
    return { bg:"var(--surf2)", border:"var(--border)", glow:"none" };
  }
  if (heat >= 0.15) {
    const t  = Math.min(heat, 1);
    const a1 = (0.12 + t * 0.40).toFixed(2);
    const a2 = (0.40 + t * 0.45).toFixed(2);
    return { bg:`rgba(239,68,68,${a1})`, border:`rgba(239,68,68,${a2})`,
             glow:`0 0 10px rgba(239,68,68,${(t*0.5).toFixed(2)})` };
  }
  if (heat <= -0.15) {
    const t  = Math.min(Math.abs(heat), 1);
    const a1 = (0.08 + t * 0.22).toFixed(2);
    const a2 = (0.25 + t * 0.35).toFixed(2);
    return { bg:`rgba(59,130,246,${a1})`, border:`rgba(59,130,246,${a2})`,
             glow:`0 0 8px rgba(59,130,246,${(t*0.4).toFixed(2)})` };
  }
  return { bg:"rgba(200,216,238,0.07)", border:"rgba(200,216,238,0.18)", glow:"none" };
}

const PHASE_ORDER = {
  "PHASE3":1, "PHASE2/PHASE3":2, "PHASE2":3, "PHASE1/PHASE2":4,
  "PHASE1":5, "EARLY_PHASE1":6, "PHASE4":7, "NA":8, "—":9,
};
function phaseSort(a, b) {
  return (PHASE_ORDER[a.phase] || 99) - (PHASE_ORDER[b.phase] || 99);
}

const PHASE_COLORS = {
  "PHASE3":"#22C55E", "PHASE2/PHASE3":"#86EFAC", "PHASE2":"#38BDF8",
  "PHASE1/PHASE2":"#7DD3FC", "PHASE1":"#A78BFA", "EARLY_PHASE1":"#C4B5FD",
  "PHASE4":"#FB923C", "NA":"#6B7280", "—":"#4B5563",
};

function WQ7BubbleMatrix({ data, color }) {
  const [openCell, setOpenCell] = useState(null);
  const [tooltip,  setTooltip]  = useState(null);

  if (!data?.available) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)", padding:"20px 0" }}>
      No data — enriched file not loaded or no new drug registrations this window.
    </div>
  );

  const { rows, columns, cells, row_totals, col_totals, grand_total,
          has_heat, heat_mode, prior_weeks_used, prior_window_labels,
          week_total, db_total } = data;

  const masterLabel = parseMasterDbLabel(ALEXIS_DATA?.master_db_meta?.filename);
  const maxCount    = Math.max(...Object.values(cells).map(c => c.count), 1);
  const bubbleSize  = n => n === 0 ? 0 : Math.max(8, Math.sqrt(n / maxCount) * 40);

  const COL_W   = 66;
  const ROW_H   = 52;
  const LABEL_W = 194;

  const heatBadge = heat_mode === "rolling_avg"
    ? `✓ heat vs ${prior_weeks_used}-week rolling avg`
    : heat_mode === "master_db"
    ? `✓ heat vs ${masterLabel} baseline`
    : null;

  return (
    <div>
      {/* Summary strip */}
      <div style={{ display:"flex", gap:14, marginBottom:16,
        alignItems:"center", flexWrap:"wrap" }}>
        <div style={{ fontFamily:"var(--fm)", fontSize:12 }}>
          <span style={{ color:color.mid, fontWeight:600 }}>{fmt(grand_total)}</span>
          <span style={{ color:"var(--muted)" }}> new drug registrations this window</span>
        </div>
        <div style={{ fontFamily:"var(--fm)", fontSize:10,
          color:"var(--dim)", letterSpacing:"0.06em" }}>
          Click each bubble for more details
        </div>
        {heatBadge && (
          <div style={{ fontFamily:"var(--fm)", fontSize:10,
            color:"var(--green)", background:"rgba(34,197,94,0.08)",
            border:"1px solid rgba(34,197,94,0.3)", borderRadius:4, padding:"3px 8px" }}>
            {heatBadge}
          </div>
        )}
        {has_heat && (
          <div style={{ display:"flex", alignItems:"center", gap:8, marginLeft:"auto" }}>
            <span style={{ fontFamily:"var(--fm)", fontSize:9,
              color:"var(--dim)", letterSpacing:"0.1em" }}>HEAT</span>
            {[
              { label:"cooler",   bg:"rgba(59,130,246,0.22)",  border:"rgba(59,130,246,0.5)" },
              { label:"baseline", bg:"rgba(200,216,238,0.07)", border:"rgba(200,216,238,0.18)" },
              { label:"hotter",   bg:"rgba(239,68,68,0.38)",   border:"rgba(239,68,68,0.7)" },
            ].map(s => (
              <div key={s.label} style={{ display:"flex", alignItems:"center", gap:4 }}>
                <div style={{ width:12, height:12, borderRadius:3,
                  background:s.bg, border:`1px solid ${s.border}` }} />
                <span style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--muted)" }}>
                  {s.label}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Prior week labels */}
      {prior_window_labels?.length > 0 && (
        <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
          <span style={{ fontFamily:"var(--fm)", fontSize:9,
            color:"var(--dim)", letterSpacing:"0.1em", alignSelf:"center" }}>
            AVG OVER:
          </span>
          {prior_window_labels.map((lbl, i) => (
            <span key={i} style={{ fontFamily:"var(--fm)", fontSize:9,
              color:"var(--muted)", background:"var(--surf2)",
              border:"1px solid var(--border)", borderRadius:4, padding:"2px 7px" }}>
              {lbl}
            </span>
          ))}
        </div>
      )}

      {/* Matrix */}
      <div style={{ overflowX:"auto" }}>
        <div style={{ display:"inline-block",
          minWidth: LABEL_W + columns.length * COL_W + 56 }}>

          {/* Column headers */}
          <div style={{ display:"flex", marginLeft:LABEL_W }}>
            {columns.map(mod => (
              <div key={mod} style={{ width:COL_W, flexShrink:0,
                textAlign:"center", paddingBottom:8 }}>
                <div style={{ fontFamily:"var(--fm)", fontSize:10,
                  color:modColor(mod), letterSpacing:"0.06em", fontWeight:600 }}>
                  {MODALITY_ABBR[mod] || mod.slice(0,6)}
                </div>
                <div style={{ fontFamily:"var(--fm)", fontSize:9,
                  color:"var(--muted)", marginTop:1 }}>
                  {fmt(col_totals[mod])}
                </div>
              </div>
            ))}
            <div style={{ width:56, flexShrink:0, textAlign:"right",
              fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
              paddingBottom:8, paddingRight:4, alignSelf:"flex-end" }}>
              TOTAL
            </div>
          </div>

          {/* Rows + inline expanded panel */}
          {rows.map((ta, ri) => (
            <div key={ta}>
              <div style={{ display:"flex", alignItems:"center",
                borderTop:"1px solid var(--border)",

// ── Shared mini-sparkline SVG ─────────────────────────────────────────────
function MiniSparkline({ points, accentColor, width=220, height=64, showArea=true, fluid=false }) {
  if (!points || points.length < 2) return null;
  const vals  = points.map(p => p.drug_new ?? p.pct ?? 0);
  const maxV  = Math.max(...vals, 1);
  const minV  = Math.min(...vals, 0);
  const range = maxV - minV || 1;
  const pad   = { l:6, r:6, t:8, b:20 };
  const W = width  - pad.l - pad.r;
  const H = height - pad.t - pad.b;
  const x = i => pad.l + (i / (points.length - 1)) * W;
  const y = v => pad.t + H - ((v - minV) / range) * H;

  const ptCoords = points.map((p, i) => [x(i), y(p.drug_new ?? p.pct ?? 0)]);
  const lineD    = ptCoords.map(([px,py], i) => `${i===0?'M':'L'}${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
  const areaD    = lineD
    + ` L${ptCoords[ptCoords.length-1][0].toFixed(1)},${(pad.t+H).toFixed(1)}`
    + ` L${ptCoords[0][0].toFixed(1)},${(pad.t+H).toFixed(1)} Z`;

  const gradId = `sg-${accentColor.replace(/[^a-z0-9]/gi,'')}`;

  const svgProps = fluid
    ? { viewBox:`0 0 ${width} ${height}`, preserveAspectRatio:"none",
        style:{ overflow:"visible", display:"block", width:"100%", height:"100%" } }
    : { width, height, style:{ overflow:"visible", display:"block" } };

  return (
    <svg {...svgProps}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor={accentColor} stopOpacity="0.25" />
          <stop offset="100%" stopColor={accentColor} stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {showArea && <path d={areaD} fill={`url(#${gradId})`} />}
      <path d={lineD} fill="none" stroke={accentColor} strokeWidth="1.8"
            strokeLinejoin="round" strokeLinecap="round" />
      {ptCoords.map(([px,py], i) => {
        const isCur = points[i].is_current;
        return (
          <g key={i}>
            <circle cx={px} cy={py} r={isCur ? 5 : 3}
              fill={isCur ? accentColor : "var(--bg)"}
              stroke={accentColor} strokeWidth={isCur ? 0 : 1.5} />
            {isCur && <circle cx={px} cy={py} r={8} fill={accentColor} opacity="0.18" />}
          </g>
        );
      })}
      {/* x-axis labels */}
      {points.map((p, i) => (
        <text key={i} x={x(i)} y={pad.t + H + 14}
          textAnchor="middle" fontSize="8"
          fill={p.is_current ? accentColor : "var(--dim)"}
          fontFamily="var(--fm)"
          fontWeight={p.is_current ? "600" : "400"}>
          {p.short_label}
        </text>
      ))}
    </svg>
  );
}

// ── Diverging bar chart ────────────────────────────────────────────────────
function DivergingBars({ bars, accentColor, labelFn }) {
  if (!bars || bars.length === 0) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)",
      padding:"12px 0" }}>No prior week data available.</div>
  );

  const gainers   = bars.filter(b => b.delta_pct >= 0)
                        .sort((a,b) => b.delta_pct - a.delta_pct)
                        .slice(0, 3);
  const decliners = bars.filter(b => b.delta_pct < 0)
                        .sort((a,b) => a.delta_pct - b.delta_pct)
                        .slice(0, 3);
  if (gainers.length + decliners.length === 0) return null;

  const maxAbs = Math.max(
    ...gainers.map(b => b.delta_pct),
    ...decliners.map(b => Math.abs(b.delta_pct)),
    1
  );

  const LABEL_W = 110;

  const Row = ({ b }) => {
    const isGain = b.delta_pct >= 0;
    const pct    = Math.abs(b.delta_pct) / maxAbs * 100;
    const barCol = isGain ? (accentColor || "#F59E0B") : "rgba(59,130,246,0.8)";
    const valCol = isGain ? "#F87171" : "#60A5FA";
    return (
      <div style={{ display:"flex", alignItems:"center", gap:0, height:24 }}>
        {/* Label */}
        <div title={b.label}
          style={{ width:LABEL_W, flexShrink:0, fontFamily:"var(--fb)", fontSize:10,
            color:"var(--text)", overflowX:"auto", overflowY:"hidden",
            whiteSpace:"nowrap", textAlign:"right", paddingRight:8 }}>
          {labelFn ? labelFn(b.label) : b.label}
        </div>

        {/* Left half-track — decliners grow leftward */}
        <div style={{ flex:1, display:"flex", justifyContent:"flex-end",
          alignItems:"center", position:"relative", height:"100%" }}>
          {!isGain && (
            <div style={{ width:`${pct}%`, height:10,
              background:barCol, borderRadius:"3px 0 0 3px",
              transition:"width 0.3s ease" }} />
          )}
        </div>

        {/* Zero line */}
        <div style={{ width:2, flexShrink:0, alignSelf:"stretch",
          background:"rgba(255,255,255,0.15)" }} />

        {/* Right half-track — gainers grow rightward */}
        <div style={{ flex:1, display:"flex", justifyContent:"flex-start",
          alignItems:"center", position:"relative", height:"100%" }}>
          {isGain && (
            <div style={{ width:`${pct}%`, height:10,
              background:barCol, borderRadius:"0 3px 3px 0",
              transition:"width 0.3s ease" }} />
          )}
        </div>

        {/* Value + count */}
        <div style={{ width:58, flexShrink:0, textAlign:"right",
          fontFamily:"var(--fm)", fontSize:10, fontWeight:600, color:valCol }}>
          {isGain ? "+" : ""}{b.delta_pct.toFixed(1)}%
        </div>
        <div style={{ width:32, flexShrink:0, fontFamily:"var(--fm)",
          fontSize:9, color:"var(--dim)", textAlign:"right" }}>
          n={b.current_n}
        </div>
      </div>
    );
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
      {gainers.map(b => <Row key={b.label} b={b} />)}
      {gainers.length > 0 && decliners.length > 0 && (
        <div style={{ height:1, background:"var(--border2)",
          margin:"4px 0", opacity:0.4 }} />
      )}
      {decliners.map(b => <Row key={b.label} b={b} />)}
      <div style={{ fontFamily:"var(--fm)", fontSize:8, color:"var(--dim)",
        marginTop:4, paddingLeft:LABEL_W + 8 }}>
        bars grow from center · red = above avg · blue = below avg
      </div>
    </div>
  );
}

// ── Phase 1 intake gauge ───────────────────────────────────────────────────
function Phase1Gauge({ data, accentColor }) {
  if (!data) return null;
  const { cur_pct, avg_pct, delta_pct, cur_count, sparkline, has_prior } = data;

  const R = 50, CX = 64, CY = 64;
  const toRad = deg => deg * Math.PI / 180;
  const arcPath = (pct, r) => {
    const startAngle = -210;
    const sweep      = 240 * Math.min(pct / 100, 1);
    const endAngle   = startAngle + sweep;
    const x1 = CX + r * Math.cos(toRad(startAngle));
    const y1 = CY + r * Math.sin(toRad(startAngle));
    const x2 = CX + r * Math.cos(toRad(endAngle));
    const y2 = CY + r * Math.sin(toRad(endAngle));
    const large = sweep > 180 ? 1 : 0;
    return sweep > 0
      ? `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)}`
      : '';
  };

  const avgAngle = -210 + 240 * Math.min((avg_pct || 0) / 100, 1);
  const avgX = CX + R * Math.cos(toRad(avgAngle));
  const avgY = CY + R * Math.sin(toRad(avgAngle));

  return (
    <div style={{ display:"flex", gap:16, alignItems:"flex-start" }}>
      {/* Arc gauge */}
      <div style={{ flexShrink:0 }}>
        <svg width={128} height={92} style={{ overflow:"visible" }}>
          <path d={arcPath(100, R)} fill="none"
            stroke="var(--border2)" strokeWidth="7" strokeLinecap="round" />
          <path d={arcPath(cur_pct, R)} fill="none"
            stroke={accentColor} strokeWidth="7" strokeLinecap="round" />
          {has_prior && avg_pct != null && (
            <circle cx={avgX.toFixed(1)} cy={avgY.toFixed(1)} r="5"
              fill="var(--bg)" stroke="#F59E0B" strokeWidth="2" />
          )}
          <text x={CX} y={CY - 4} textAnchor="middle"
            fontSize="20" fontWeight="700" fill={accentColor}
            fontFamily="var(--fm)">
            {cur_pct.toFixed(1)}%
          </text>
          <text x={CX} y={CY + 14} textAnchor="middle"
            fontSize="8" fill="var(--muted)" fontFamily="var(--fm)">
            Phase 1
          </text>
        </svg>
      </div>
      {/* Stats + sparkline */}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:"flex", alignItems:"baseline", gap:6, marginBottom:6 }}>
          <span style={{ fontFamily:"var(--fm)", fontSize:18,
            fontWeight:700, color:accentColor }}>
            {cur_count} trials
          </span>

        )}

    </div>
  );
}

function exportSQ2CSV(sponsors) {
  const headers = ["rank","sponsor_name","total_trials","top_modality","top_ta","complexity_score"];
  const lines = [
    headers.join(","),
    ...sponsors.map((r, i) => [
      i + 1,
      `"${r.sponsor_name}"`,
      r.total_trials,
      r.top_modality || "",
      `"${r.top_ta || ""}"`,
      r.complexity_score,
    ].join(","))
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bd_sq2_top_sponsors.csv";
  a.click();
}

function SQ2TopSponsors({ data, color }) {
  const [hoveredSeg, setHoveredSeg] = useState(null); // {sponsor, mod, count, x, y}
  const [showZoom, setShowZoom] = useState(false);

  if (!data?.available) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)", padding:"20px 0" }}>
      No quarterly sponsor data available.<br />
      <span style={{ color:"var(--dim)", fontSize:11 }}>
        Run the quarterly pipeline with a master DB to generate this view.
      </span>
    </div>
  );

  const { top_sponsors, modality_leaders, ta_leaders, meta } = data;
  const maxTrials = top_sponsors[0]?.total_trials || 1;

  // Zoomed view: sponsors 13-25 rescaled so small bars are readable
  const zoomCutoff = 12;
  const tailSponsors = top_sponsors.slice(zoomCutoff);
  const tailMax = tailSponsors[0]?.total_trials || 1;

  // Consistent modality ordering across all bars (most common first)
  const allMods = useMemo(() => {
    const counts = {};
    for (const s of top_sponsors) {
      for (const [mod, n] of Object.entries(s.modality_breakdown || {})) {
        counts[mod] = (counts[mod] || 0) + n;
      }
    }
    return Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .map(([mod]) => mod);
  }, [top_sponsors]);

  // Filter modality leaders to those with >=10 trials
  const modLeaderEntries = useMemo(() => {
    return Object.entries(modality_leaders || {})
      .map(([mod, leaders]) => {
        const total = leaders.reduce((s, l) => s + l.count, 0);
        return { mod, leaders, total };
      })
      .filter(e => e.total >= 10)
      .sort((a, b) => b.total - a.total);

  // Filter TA leaders — exclude Unassigned, sort by total desc
  const taLeaderEntries = useMemo(() => {
    return Object.entries(ta_leaders || {})
      .filter(([ta, info]) => info.total >= 50

      .sort((a, b) => b[1].total - a[1].total);

            background:"transparent", border:"1px solid var(--border2)",

            letterSpacing:"0.1em" }}>

      <div style={{ display:"grid",
        gridTemplateColumns:"repeat(4, minmax(0, 1fr))", gap:10 }}>
        {taLeaderEntries.map(([ta, info]) => {
          const heat = info.share_pct >= 30 ? "var(--red)"

            : "var(--muted)";

          // Build donut arcs from phase_dist
          const phaseDist = info.phase_dist || {};
          const phaseTotal = Object.values(phaseDist).reduce((s, n) => s + n, 0) || 1;
          // Bucket phases: P1 (incl early/P1P2), P2 (incl P2P3), P3, P4, Other
          const buckets = [
            { key:"PHASE1", label:"P1", count:
              (phaseDist["PHASE1"]||0)+(phaseDist["EARLY_PHASE1"]||0)+(phaseDist["PHASE1/PHASE2"]||0) },
            { key:"PHASE2", label:"P2", count:
              (phaseDist["PHASE2"]||0)+(phaseDist["PHASE2/PHASE3"]||0) },
            { key:"PHASE3", label:"P3", count: phaseDist["PHASE3"]||0 },
            { key:"PHASE4", label:"P4", count: phaseDist["PHASE4"]||0 },
            { key:"NA", label:"Other", count:
              phaseTotal - ((phaseDist["PHASE1"]||0)+(phaseDist["EARLY_PHASE1"]||0)+
              (phaseDist["PHASE1/PHASE2"]||0)+(phaseDist["PHASE2"]||0)+
              (phaseDist["PHASE2/PHASE3"]||0)+(phaseDist["PHASE3"]||0)+
              (phaseDist["PHASE4"]||0)) },
          ].filter(b => b.count > 0);

          // SVG donut arcs
          const R = 22, r = 14, cx = 26, cy = 26;
          let cumAngle = -90; // start at top
          const arcs = buckets.map(b => {
            const angle = (b.count / phaseTotal) * 360;
            const startAngle = cumAngle;
            cumAngle += angle;
            const endAngle = cumAngle;
            const largeArc = angle > 180 ? 1 : 0;
            const toRad = a => (a * Math.PI) / 180;
            const x1 = cx + R * Math.cos(toRad(startAngle));
            const y1 = cy + R * Math.sin(toRad(startAngle));
            const x2 = cx + R * Math.cos(toRad(endAngle));
            const y2 = cy + R * Math.sin(toRad(endAngle));
            const ix1 = cx + r * Math.cos(toRad(endAngle));
            const iy1 = cy + r * Math.sin(toRad(endAngle));
            const ix2 = cx + r * Math.cos(toRad(startAngle));
            const iy2 = cy + r * Math.sin(toRad(startAngle));
            // Full circle case
            if (buckets.length === 1) {
              return (
                <circle key={b.key} cx={cx} cy={cy} r={(R+r)/2}
                  fill="none" stroke={PHASE_COLORS[b.key]||"#475569"}
                  strokeWidth={R-r} opacity={0.85}
                  style={{ cursor:"pointer" }}
                  onMouseEnter={e => {
                    const rect = e.target.getBoundingClientRect();
                    setHoveredPhase({ ta, label:b.key==="NA"?"Other":b.key.replace("PHASE","P"), count:b.count, pct:Math.round(100*b.count/phaseTotal), color:PHASE_COLORS[b.key]||"#475569", x:rect.left+rect.width/2, y:rect.top-4 });
                  }}
                  onMouseLeave={() => setHoveredPhase(null)} />
              );
            }
            const d = [
              `M ${x1} ${y1}`,
              `A ${R} ${R} 0 ${largeArc} 1 ${x2} ${y2}`,
              `L ${ix1} ${iy1}`,
              `A ${r} ${r} 0 ${largeArc} 0 ${ix2} ${iy2}`,
              `Z`
            ].join(" ");
            return <path key={b.key} d={d}
              fill={PHASE_COLORS[b.key]||"#475569"} opacity={0.85}
              style={{ cursor:"pointer" }}
              onMouseEnter={e => {
                const rect = e.target.getBoundingClientRect();
                setHoveredPhase({ ta, label:b.key==="NA"?"Other":b.key.replace("PHASE","P"), count:b.count, pct:Math.round(100*b.count/phaseTotal), color:PHASE_COLORS[b.key]||"#475569", x:rect.left+rect.width/2, y:rect.top-4 });
              }}
              onMouseLeave={() => setHoveredPhase(null)} />;
          });

          return (
            <div key={ta}
              style={{ background:"var(--surf2)", borderRadius:8,
                border:"1px solid var(--border)", padding:"12px",
                borderLeft:`3px solid ${heat}`,
                display:"flex", gap:10, alignItems:"center" }}>

              {/* Left: text info */}
              <div style={{ flex:1, minWidth:0 }}>
                {/* TA name */}
                <div style={{ fontFamily:"var(--fm)", fontSize:9,
                  color:"var(--muted)", letterSpacing:"0.08em",
                  marginBottom:5, overflow:"hidden",
                  textOverflow:"ellipsis", whiteSpace:"nowrap" }}
                  title={ta}>
                  {ta.toUpperCase()}
                </div>

                {/* Dominant sponsor */}
                <div style={{ fontFamily:"var(--fm)", fontSize:10,
                  color:"var(--text)", fontWeight:500,
                  overflow:"hidden", textOverflow:"ellipsis",
                  whiteSpace:"nowrap", marginBottom:4 }}
                  title={info.sponsor}>
                  {info.sponsor}
                </div>

                {/* Count + share */}
                <div style={{ display:"flex", alignItems:"baseline", gap:4 }}>
                  <span style={{ fontFamily:"var(--fm)", fontSize:13,
                    fontWeight:600, color:heat }}>
                    {info.count}
                  </span>
                  <span style={{ fontFamily:"var(--fm)", fontSize:8,
                    color:"var(--dim)" }}>
                    / {fmt(info.total)} ({info.share_pct}%)
                  </span>
                </div>
              </div>

              {/* Right: phase donut */}
              <div style={{ flexShrink:0, position:"relative",
                width:52, height:52 }}>
                <svg width={52} height={52} viewBox="0 0 52 52">
                  {arcs}
                </svg>
                {/* Center label: total */}
                <div style={{ position:"absolute", top:0, left:0,
                  width:52, height:52, display:"flex",
                  alignItems:"center", justifyContent:"center",
                  pointerEvents:"none" }}>
                  <span style={{ fontFamily:"var(--fm)", fontSize:9,
                    fontWeight:600, color:"var(--text)" }}>
                    {info.count}
                  </span>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Phase donut tooltip */}
      {hoveredPhase && (
        <div style={{ position:"fixed", zIndex:999,
          left:hoveredPhase.x, top:hoveredPhase.y,
          transform:"translate(-50%, -100%)",
          background:"var(--surf2)", border:"1px solid var(--border2)",
          borderRadius:6, padding:"6px 10px", pointerEvents:"none",
          boxShadow:"0 4px 12px rgba(0,0,0,0.4)" }}>
          <div style={{ fontFamily:"var(--fm)", fontSize:10, color:hoveredPhase.color,
            marginBottom:2 }}>
            {hoveredPhase.label}
          </div>
          <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--text)" }}>
            {hoveredPhase.count} trials
            <span style={{ color:"var(--muted)", fontSize:10, marginLeft:6 }}>
              ({hoveredPhase.pct}%)
            </span>
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
        marginTop:16, letterSpacing:"0.06em" }}>
        Source: {meta?.master_db_file} · {fmt(meta?.total_industry_drug)} industry drug trials · {fmt(meta?.unique_sponsors)} unique sponsors
      </div>
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────
// viz/mk_sq1_sq.jsx
// MK / sq1 — Modality Landscape for Thought Leadership Content
//
// Data source : ALEXIS_DATA.sq4  (from analytics/mk_sq1.py → sq1_full_history())
// Injected by : pipelines/generate_quarterly_viz.py
//
// Side-by-side layout:
//   LEFT  (~40%) — Hero Donut with colored arcs per modality
//   RIGHT (~60%) — Clickable legend grid → opens detail modal
// ─────────────────────────────────────────────────────────────────────────

function SQ1ModalityLandscape({ data, color }) {
  if (!data?.available) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)",
      padding:"20px 0" }}>
      No modality landscape data available.
    </div>
  );

  const [hoveredMod, setHoveredMod] = React.useState(null);
  const [selectedMod, setSelectedMod] = React.useState(null);

  const mods = data.modalities || [];
  const total = data.total_drug_trials || 0;
  const periods = data.periods || [];

  // ── Phase colors (reuse from bd_sq2) ──────────────────────────────────────────────────
  const PHASE_COLORS = {
    PHASE1:"#60a5fa", PHASE2:"#34d399", PHASE3:"#fbbf24",
    PHASE4:"#f87171", NA:"#6b7280",
    "EARLY_PHASE1":"#93c5fd", "PHASE1/PHASE2":"#5eead4",
    "PHASE2/PHASE3":"#a3e635",
  };
  const phaseColor = k => {
    if (PHASE_COLORS[k]) return PHASE_COLORS[k];
    for (const [pk, pc] of Object.entries(PHASE_COLORS)) {
      if (k.toUpperCase().includes(pk)) return pc;
    }
    return "#6b7280";
  };

  // ── Phase bucket helper ───────────────────────────────────────────────────────
  const bucketPhase = dist => {
    const b = { P1:0, P2:0, P3:0, P4:0, Other:0 };
    for (const [k, v] of Object.entries(dist || {})) {
      const u = k.toUpperCase();
      if (u.includes("PHASE1") && !u.includes("PHASE2")) b.P1 += v;
      else if (u.includes("PHASE2") && !u.includes("PHASE3")) b.P2 += v;
      else if (u.includes("PHASE3")) b.P3 += v;
      else if (u.includes("PHASE4")) b.P4 += v;
      else b.Other += v;
    }
    return b;
  };
  const BUCKET_COLORS = { P1:"#60a5fa", P2:"#34d399", P3:"#fbbf24", P4:"#f87171", Other:"#6b7280" };

  // ── Trend colors ──────────────────────────────────────────────────────────
  const trendColor = t => t === "growing" ? "#34d399" : t === "declining" ? "#f87171" : "#6b7280";
  const trendIcon = t => t === "growing" ? "▲" : t === "declining" ? "▼" : "●";

  // ── Sponsor class colors ──────────────────────────────────────────────────
  const CLASS_COLORS = { INDUSTRY:"#60a5fa", NIH:"#fbbf24", OTHER:"#6b7280" };

  // ── CSV export ────────────────────────────────────────────────────────────
  const exportCSV = () => {
    const header = "Modality,Count,Pct,Trend,Growth Rate,YoY Delta,Maturity,Sponsors,Complexity";
    const rows = mods.map(m =>
      [humanMod(m.name), m.count, m.pct, m.trend || "", m.growth_rate || "",
       m.delta_yoy_count || "", m.maturity, m.unique_sponsors, m.complexity_weight].join(",")
    );
    const blob = new Blob([header + "\n" + rows.join("\n")], { type:"text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "modality_landscape.csv";
    a.click();
  };

  // ═══════════════════════════════════════════════════════════════════════
  // DONUT ARCS
  // ═══════════════════════════════════════════════════════════════════════
  const R = 110, SW = 36, cx = 140, cy = 140, viewBox = "0 0 280 280";

  const donutArcs = React.useMemo(() => {
    let cumAngle = -90;
    return mods.map(m => {
      const angle = (m.count / total) * 360;
      const startAngle = cumAngle;
      cumAngle += angle;
      const endAngle = cumAngle;
      const largeArc = angle > 180 ? 1 : 0;
      const toRad = d => d * Math.PI / 180;
      const x1 = cx + R * Math.cos(toRad(startAngle));
      const y1 = cy + R * Math.sin(toRad(startAngle));
      const x2 = cx + R * Math.cos(toRad(endAngle));
      const y2 = cy + R * Math.sin(toRad(endAngle));
      return { ...m, startAngle, endAngle, largeArc, x1, y1, x2, y2, angle };
    });
  }, [mods, total]);

  // ═══════════════════════════════════════════════════════════════════════
  // SPARKLINE
  // ═══════════════════════════════════════════════════════════════════════
  const Sparkline = ({ history, width = 64, height = 24, showLabels = false }) => {
    if (!history || history.length < 2) return null;
    const counts = history.map(h => h.count);
    const maxC = Math.max(...counts);
    const minC = Math.min(...counts);
    const range = maxC - minC || 1;
    const labelH = showLabels ? 14 : 0;
    const chartH = height - labelH;
    const points = counts.map((c, i) =>
      `${(i / (counts.length - 1)) * width},${chartH - ((c - minC) / range) * (chartH - 2) - 1}`
    ).join(" ");
    const lastTrend = counts[counts.length - 1] >= counts[0] ? "#34d399" : "#f87171";
    return (
      <svg width={width} height={height} style={{ display:"block" }}>
        <polyline points={points} fill="none" stroke={lastTrend} strokeWidth={1.5}
          strokeLinecap="round" strokeLinejoin="round" />
        {showLabels && history.map((h, i) => {
          const x = (i / (counts.length - 1)) * width;
          const yr = (h.period || "").replace("_Q", " Q");
          // show first, last, and every other label to avoid overlap
          if (i !== 0 && i !== history.length - 1 && i % 2 !== 0) return null;
          return (
            <text key={i} x={x} y={height - 1} textAnchor={i === 0 ? "start" : i === history.length - 1 ? "end" : "middle"}
              style={{ fontSize:7, fontFamily:"var(--fm)", fill:"var(--dim)" }}>
              {yr}
            </text>
          );
        })}
      </svg>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════
  // DETAIL MODAL
  // ═══════════════════════════════════════════════════════════════════════
  const DetailModal = ({ m, meta, periods, onClose }) => {
    if (!m) return null;

    const pb = bucketPhase(m.phase_dist);
    const phaseTotal = Object.values(pb).reduce((a, b) => a + b, 0);
    const classTotal = Object.values(m.sponsor_class_split || {}).reduce((a, b) => a + b, 0);

    return (
      <div
        onClick={onClose}
        style={{
          position:"fixed", top:0, left:0, right:0, bottom:0,
          background:"rgba(0,0,0,0.6)", display:"flex", alignItems:"center",
          justifyContent:"center", zIndex:9999,
        }}>
        <div
          onClick={e => e.stopPropagation()}
          style={{
            background:"var(--surf2)", border:"1px solid var(--border)",
            borderRadius:10, padding:"24px 28px", width:680, maxWidth:"90vw",
            maxHeight:"85vh", overflowY:"auto", position:"relative",
          }}>

          {/* Close button */}
          <button
            onClick={onClose}
            style={{
              position:"absolute", top:12, right:14, background:"none",
              border:"none", color:"var(--muted)", fontSize:18, cursor:"pointer",
              fontFamily:"var(--fm)", lineHeight:1, padding:"2px 6px",
            }}>
            ✕
          </button>

          {/* Header: name + count + pct + YoY delta */}
          <div>
            <div style={{ display:"flex", alignItems:"baseline", gap:8, flexWrap:"wrap" }}>
              <span style={{ fontFamily:"var(--fh)", fontSize:18, fontWeight:700,
                color:modColor(m.name) }}>
                {humanMod(m.name)}
              </span>
              <span style={{ fontFamily:"var(--fm)", fontSize:13, color:"var(--muted)" }}>
                {fmt(m.count)} · {m.pct}%
              </span>
              {m.delta_yoy_count != null && (
                <span style={{ fontFamily:"var(--fm)", fontSize:11,
                  color: m.delta_yoy_count >= 0 ? "#34d399" : "#f87171" }}>
                  {m.delta_yoy_count >= 0 ? "▲" : "▼"} {Math.abs(m.delta_yoy_count)} YoY
                </span>
              )}
            </div>
            {periods?.length > 0 && (
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)", marginTop:4 }}>
                {periods[periods.length - 1].replace("_", " ")}
              </div>
            )}

            {/* Trend badge + sparkline */}
            <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:8 }}>
              {m.trend && (
                <span style={{ fontFamily:"var(--fm)", fontSize:10, padding:"2px 8px",
                  borderRadius:4, background: trendColor(m.trend) + "22",
                  color: trendColor(m.trend), letterSpacing:"0.06em" }}>
                  {trendIcon(m.trend)} {m.trend.toUpperCase()}
                  {m.growth_rate != null ? ` ${m.growth_rate > 0 ? "+" : ""}${m.growth_rate}%` : ""}
                </span>
              )}
              <Sparkline history={m.history} width={280} height={48} showLabels />
            </div>
          </div>

          {/* Top TAs */}
          {m.top_tas?.length > 0 && (
            <div style={{ marginTop:16 }}>
              <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
                marginBottom:5, letterSpacing:"0.06em", textTransform:"uppercase" }}>
                Top Therapeutic Areas
              </div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                {m.top_tas.slice(0, 5).map(ta => (
                  <span key={ta.name} style={{ fontFamily:"var(--fm)", fontSize:10,
                    padding:"3px 8px", borderRadius:4, background:"var(--border)",
                    color:"var(--muted)", whiteSpace:"nowrap" }}>
                    {ta.name}
                  </span>
                ))}
              </div>
            </div>
          )}

          {/* Phase distribution */}
          <div style={{ marginTop:16 }}>
            <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
              marginBottom:4, letterSpacing:"0.06em", textTransform:"uppercase" }}>
              Phase Distribution
            </div>
            <div style={{ display:"flex", height:8, borderRadius:4, overflow:"hidden" }}>
              {Object.entries(BUCKET_COLORS).map(([bk, bc]) => {
                const w = phaseTotal > 0 ? (pb[bk] / phaseTotal) * 100 : 0;
                if (w < 0.5) return null;
                return <div key={bk} style={{ width:`${w}%`, background:bc, minWidth:2 }} />;
              })}
            </div>
            <div style={{ display:"flex", gap:10, marginTop:4 }}>
              {Object.entries(BUCKET_COLORS).map(([bk, bc]) => {
                const n = pb[bk];
                if (!n) return null;
                return (
                  <span key={bk} style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)" }}>
                    <span style={{ color:bc }}>{bk}</span> {Math.round(n / phaseTotal * 100)}%
                  </span>
                );
              })}
            </div>
          </div>

          {/* Sponsor diversity */}
          <div style={{ marginTop:16 }}>
            <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
              marginBottom:4, letterSpacing:"0.06em", textTransform:"uppercase" }}>
              {fmt(m.unique_sponsors)} Sponsors
            </div>
            <div style={{ display:"flex", height:6, borderRadius:3, overflow:"hidden" }}>
              {Object.entries(CLASS_COLORS).map(([ck, cc]) => {
                const n = (m.sponsor_class_split || {})[ck] || 0;
                const w = classTotal > 0 ? (n / classTotal) * 100 : 0;
                if (w < 0.5) return null;
                return <div key={ck} style={{ width:`${w}%`, background:cc, minWidth:2 }} />;
              })}
            </div>
            <div style={{ display:"flex", gap:10, marginTop:3 }}>
              {Object.entries(CLASS_COLORS).map(([ck, cc]) => {
                const n = (m.sponsor_class_split || {})[ck] || 0;
                if (!n) return null;
                return (
                  <span key={ck} style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)" }}>
                    <span style={{ color:cc }}>{ck}</span> {Math.round(n / classTotal * 100)}%
                  </span>
                );
              })}
            </div>
          </div>

          {/* Maturity badge + complexity weight */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:16 }}>
            {(() => {
              const matColors = {
                "FIH-heavy":"#60a5fa", "Dose finding-heavy":"#34d399",
                "Comparative-heavy":"#fbbf24", "RWE-heavy":"#f87171",
              };
              const c = matColors[m.maturity] || "#6b7280";
              return (
                <span style={{ fontFamily:"var(--fm)", fontSize:10, padding:"2px 8px",
                  borderRadius:4, background:c+"22", color:c }}>
                  {m.maturity === "balanced" ? "Balanced pipeline" : m.maturity}
                  {m.maturity_dominant_pct ? ` (${m.maturity_dominant_pct}%)` : ""}
                </span>
              );
            })()}
            <span style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)" }}>
              CW: {m.complexity_weight}×
            </span>
          </div>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════════════════
  return (
    <div>
      {/* CSV export — top-right */}
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:8 }}>
        <button onClick={exportCSV}
          style={{ fontFamily:"var(--fm)", fontSize:10, color:color.mid, background:"none",
            border:`1px solid ${color.accent}33`, borderRadius:4, padding:"3px 10px",
            cursor:"pointer", letterSpacing:"0.08em" }}>
          ⬇ CSV
        </button>
      </div>

      {/* ── Main layout: side-by-side ── */}
      <div style={{ display:"flex", gap:24, alignItems:"flex-start" }}>

        {/* LEFT — Donut */}
        <div style={{ flex:"0 0 280px", display:"flex", flexDirection:"column",
          alignItems:"center" }}>
          <div style={{ position:"relative", width:280, height:280 }}>
            <svg viewBox={viewBox} width={280} height={280}>
              {donutArcs.map((arc, i) => {
                const isHovered = hoveredMod === arc.name;
                if (arc.angle < 0.5) return null;
                return (
                  <path key={i}
                    d={`M ${arc.x1} ${arc.y1} A ${R} ${R} 0 ${arc.largeArc} 1 ${arc.x2} ${arc.y2}`}
                    fill="none"
                    stroke={modColor(arc.name)}
                    strokeWidth={isHovered ? SW + 8 : SW}
                    opacity={hoveredMod && !isHovered ? 0.3 : 1}
                    style={{ transition:"all 0.15s", cursor:"pointer" }}
                    onMouseEnter={() => setHoveredMod(arc.name)}
                    onMouseLeave={() => setHoveredMod(null)}
                  />
                );
              })}
            </svg>
            {/* Center label */}
            <div style={{ position:"absolute", top:0, left:0, width:280, height:280,
              display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              pointerEvents:"none" }}>
              <div style={{ fontFamily:"var(--fh)", fontSize:28, fontWeight:700, color:"var(--text)" }}>
                {fmt(total)}
              </div>
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
                letterSpacing:"0.12em", textTransform:"uppercase" }}>
                Drug Trials
              </div>
            </div>
            {/* Hover tooltip */}
            {hoveredMod && (() => {
              const m = mods.find(x => x.name === hoveredMod);
              if (!m) return null;
              return (
                <div style={{ position:"absolute", top:-8, left:"50%", transform:"translateX(-50%)",
                  background:"var(--surf)", border:"1px solid var(--border)", borderRadius:6,
                  padding:"6px 10px", pointerEvents:"none", whiteSpace:"nowrap", zIndex:10 }}>
                  <span style={{ fontFamily:"var(--fm)", fontSize:11, fontWeight:600, color:"var(--text)" }}>
                    {humanMod(m.name)}
                  </span>
                  <span style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)", marginLeft:8 }}>
                    {fmt(m.count)} · {m.pct}%
                  </span>
                </div>
              );
            })()}
          </div>

          {/* Period info below donut */}
          {periods.length > 1 && (
            <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
              marginTop:10, letterSpacing:"0.08em", textAlign:"center" }}>
              {periods.length} periods · {periods[0]} → {periods[periods.length - 1]}
            </div>
          )}
        </div>

        {/* RIGHT — Clickable legend grid */}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
            marginBottom:8, letterSpacing:"0.06em" }}>
            Click for more details:
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3, minmax(0,1fr))", gap:8 }}>
            {mods.map(m => {
              const isHovered = hoveredMod === m.name;
              const isSelected = selectedMod === m.name;
              return (
                <div
                  key={m.name}
                  onClick={() => setSelectedMod(m.name)}
                  onMouseEnter={() => setHoveredMod(m.name)}
                  onMouseLeave={() => setHoveredMod(null)}
                  style={{
                    background: isHovered || isSelected ? "var(--surf)" : "var(--surf2)",
                    borderRadius:6,
                    border: `1px solid ${isHovered || isSelected ? color.accent + "44" : "var(--border)"}`,
                    borderLeft: `3px solid ${modColor(m.name)}`,
                    padding:"10px 12px",
                    cursor:"pointer",
                    transition:"all 0.15s",
                    minWidth:0, overflow:"hidden",
                  }}>
                  <div style={{ fontFamily:"var(--fh)", fontSize:12, fontWeight:700,
                    color:"var(--text)", whiteSpace:"nowrap", overflow:"hidden",
                    textOverflow:"ellipsis" }}>
                    {humanMod(m.name)}
                  </div>
                  <div style={{ display:"flex", alignItems:"baseline", gap:6, marginTop:3 }}>
                    <span style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
                      {fmt(m.count)}
                    </span>
                    <span style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)" }}>
                      {m.pct}%
                    </span>
                    {m.trend && (
                      <span style={{ fontFamily:"var(--fm)", fontSize:9,
                        color:trendColor(m.trend), marginLeft:"auto" }}>
                        {trendIcon(m.trend)}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Footer meta */}
      <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
        marginTop:12, textAlign:"right", letterSpacing:"0.06em" }}>
        Source: {data.meta?.master_db_file} · {fmt(total)} drug trials ·
        {data.meta?.unique_modalities} modalities · {data.meta?.periods_loaded} periods
      </div>

      {/* Modal overlay */}
      {selectedMod && (
        <DetailModal
          m={mods.find(x => x.name === selectedMod)}
          meta={data.meta}
          periods={data.periods}
          onClose={() => setSelectedMod(null)}
        />
      )}

// viz/ops_sq1_sq.jsx

const TIER_COLORS = {
  Critical: "#EF4444",
  High:     "#F59E0B",
  Medium:   "#38BDF8",
  Low:      "#6B7280",
};

const PLATFORM_COLORS = {
  LCMS:   "#22C55E",
  LBA:    "#A78BFA",
  Hybrid: "#FBBF24",
};

// -- Waffle Grid ----------------------------------------------------------
// 10x10 = 100 cells.  Each cell = 1% of total trial volume.

function WaffleGrid({ tiers }) {
  const size = 180, pad = 4, gap = 2, cols = 10;
  const cell = (size - 2 * pad - (cols - 1) * gap) / cols;

  const cells = [];
  for (const tier of tiers) {
    const count = Math.round(tier.pct_volume);
    for (let i = 0; i < count && cells.length < 100; i++) {
      cells.push(TIER_COLORS[tier.name] || "#6B7280");
    }
  }
  while (cells.length < 100) cells.push(TIER_COLORS.Low);

  return (
    <svg width={size} height={size} style={{ display: "block" }}>
      {cells.map((color, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x   = pad + col * (cell + gap);
        const y   = pad + row * (cell + gap);
        return (
          <rect key={i} x={x} y={y} width={cell} height={cell}
                rx={2} fill={color} opacity={0.85} />
        );
      })}
    </svg>
  );
}

// -- Donut Ring -----------------------------------------------------------

function WorkloadDonut({ tiers, size = 180 }) {
  const cx = size / 2, cy = size / 2;
  const outer = size / 2 - 4, inner = outer * 0.6;
  const total = tiers.reduce((s, t) => s + t.workload, 0) || 1;
  let startAngle = -90;

  function arcPath(start, end, r1, r2) {
    const toRad = (d) => (d * Math.PI) / 180;
    const x1 = cx + r2 * Math.cos(toRad(start));
    const y1 = cy + r2 * Math.sin(toRad(start));
    const x2 = cx + r2 * Math.cos(toRad(end));
    const y2 = cy + r2 * Math.sin(toRad(end));
    const x3 = cx + r1 * Math.cos(toRad(end));
    const y3 = cy + r1 * Math.sin(toRad(end));
    const x4 = cx + r1 * Math.cos(toRad(start));
    const y4 = cy + r1 * Math.sin(toRad(start));
    const large = end - start > 180 ? 1 : 0;
    return [
      "M", x1, y1, "A", r2, r2, 0, large, 1, x2, y2,
      "L", x3, y3, "A", r1, r1, 0, large, 0, x4, y4, "Z"
    ].join(" ");
  }

  const arcs = [];
  for (const tier of tiers) {
    if (tier.workload <= 0) continue;
    const sweep = (tier.workload / total) * 360;
    const end = startAngle + sweep;
    arcs.push(
      <path key={tier.name}
            d={arcPath(startAngle, end - 0.5, inner, outer)}
            fill={TIER_COLORS[tier.name] || "#6B7280"} />
    );
    startAngle = end;
  }

  return (
    <svg width={size} height={size} style={{ display: "block" }}>
      {arcs}
      <text x={cx} y={cy - 8} textAnchor="middle"
            style={{ fill: "var(--text)", fontSize: 20, fontWeight: 700, fontFamily: "var(--fm)" }}>
        {(total / 1000).toFixed(1)}k
      </text>
      <text x={cx} y={cy + 12} textAnchor="middle"
            style={{ fill: "var(--muted)", fontSize: 10, fontFamily: "var(--fm)" }}>
        workload pts
      </text>
    </svg>
  );
}

// -- Platform Bar ---------------------------------------------------------

function PlatformBar({ split, width = 160 }) {
  const total = (split.LCMS || 0) + (split.LBA || 0) + (split.Hybrid || 0);
  if (total === 0) return null;
  const h = 14;
  const segments = [];
  let x = 0;
  for (const plat of ["LCMS", "LBA", "Hybrid"]) {
    const count = split[plat] || 0;
    if (count === 0) continue;
    const w = (count / total) * width;
    segments.push(
      <rect key={plat} x={x} y={0} width={w} height={h}
            fill={PLATFORM_COLORS[plat]} rx={x === 0 ? 3 : 0} opacity={0.85} />
    );
    x += w;
  }
  return (
    <svg width={width} height={h} style={{ display: "block" }}>
      {segments}
    </svg>
  );
}

// -- CSV Export -----------------------------------------------------------

function exportSQ10CSV(tiers) {
  const headers = ["tier","volume","pct_volume","workload","pct_workload","LCMS","LBA","Hybrid"];
  const lines = [
    headers.join(","),
    ...tiers.map(t => [
      t.name, t.volume, t.pct_volume, t.workload, t.pct_workload,
      t.platform_split?.LCMS || 0, t.platform_split?.LBA || 0,
      t.platform_split?.Hybrid || 0,
    ].join(","))
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ops_sq1_workload_forecast.csv";
  a.click();
}

const SQ9_TIER_COLORS = {
  high:   "#22C55E",
  medium: "#F59E0B",
  low:    "#EF4444",
};

function ArcGauge({ score, size = 80, label }) {
  const r = (size - 10) / 2;
  const cx = size / 2, cy = size / 2 + 4;
  const startAngle = Math.PI;
  const sweep = Math.PI * Math.min(score, 100) / 100;
  const endAngle = startAngle + sweep;
  const x1 = cx + r * Math.cos(startAngle);
  const y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle);
  const y2 = cy + r * Math.sin(endAngle);
  const large = sweep > Math.PI ? 1 : 0;
  const color = score >= 80 ? "#22C55E" : score >= 60 ? "#F59E0B" : "#EF4444";
  const bgX2 = cx + r * Math.cos(2 * Math.PI);
  const bgY2 = cy + r * Math.sin(2 * Math.PI);
  return (
    <svg width={size} height={size / 2 + 12} style={{ display: "block", margin: "0 auto" }}>
      <path d={`M ${x1} ${y1} A ${r} ${r} 0 1 1 ${bgX2} ${bgY2}`}
        fill="none" stroke="var(--border)" strokeWidth="6" strokeLinecap="round" />
      {score > 0 && (
        <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`}
          fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" />
      )}
      <text x={cx} y={cy - 4} textAnchor="middle"
        fontSize="18" fontWeight="700" fontFamily="var(--fh)" fill={color}>
        {score.toFixed(1)}%
      </text>
    </svg>
  );
}

function StackedBar({ segments, total, height = 20 }) {
  if (!total) return null;
  return (
    <div style={{ display: "flex", height, borderRadius: 4, overflow: "hidden",
      background: "var(--surf2)" }}>
      {segments.map((seg, i) => {
        const pct = (seg.value / total) * 100;
        if (pct < 0.3) return null;
        return (
          <div key={i} title={`${seg.label}: ${fmt(seg.value)} (${pct.toFixed(1)}%)`}
            style={{ width: `${pct}%`, background: seg.color, minWidth: pct > 0 ? 2 : 0,
              transition: "width 0.3s" }} />
        );
      })}
    </div>
  );
}

function StackedBarLegend({ segments, total }) {
