<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALEXIS — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090F;
      --surf:    #0C1118;
      --surf2:   #111926;
      --surf3:   #0F1620;
      --border:  #1A2840;
      --border2: #243350;
      --text:    #C8D8EE;
      --muted:   #4A5E78;
      --dim:     #253040;
      --cyan:    #00CFFF;
      --blue:    #3B82F6;
      --green:   #22C55E;
      --amber:   #F59E0B;
      --red:     #EF4444;
      --purple:  #A78BFA;
      --fh:      'Barlow Condensed', sans-serif;
      --fb:      'Barlow', sans-serif;
      --fm:      'JetBrains Mono', monospace;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--fb); font-size: 14px; min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    DATA injected by pipelines/generate_weekly_viz.py
    To migrate to an app: replace ALEXIS_DATA with a fetch('/api/weekly-viz') call.
  -->
  <script>
    const ALEXIS_DATA = /* __ALEXIS_DATA_PLACEHOLDER__ */;
  </script>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ─────────────────────────────────────────────────────────────────────
    // Shared constants
    // ─────────────────────────────────────────────────────────────────────

    const TEAM_CFG = {
      BD:          { accent: "#3B82F6", mid: "#93C5FD" },
      Marketing:   { accent: "#8B5CF6", mid: "#C4B5FD" },
      Scientific:  { accent: "#10B981", mid: "#6EE7B7" },
      Operations:  { accent: "#F59E0B", mid: "#FCD34D" },
    };

    const MODALITY_COLORS = {
      small_molecule:          "#3B82F6",
      biologic:                "#8B5CF6",
      mab:                     "#6366F1",
      monoclonal_antibody:     "#6366F1",
      antibody_drug_conjugate: "#EC4899",
      adc:                     "#EC4899",
      gene_therapy:            "#22C55E",
      cell_therapy:            "#14B8A6",
      radiopharmaceutical:     "#F59E0B",
      oligonucleotide:         "#EF4444",
      peptide:                 "#A78BFA",
      vaccine:                 "#34D399",
    };

    const PRIORITY_CFG = {
      HIGH: { color: "#EF4444", bg: "rgba(239,68,68,0.10)",   border: "#EF444430" },
      MED:  { color: "#F59E0B", bg: "rgba(245,158,11,0.10)",  border: "#F59E0B30" },
      LOW:  { color: "#4A5E78", bg: "rgba(74,94,120,0.08)",   border: "#4A5E7830" },
    };

    // ─────────────────────────────────────────────────────────────────────
    // Shared helpers
    // ─────────────────────────────────────────────────────────────────────

    const fmt      = n  => n != null ? Number(n).toLocaleString() : "—";
    const modColor = k  => MODALITY_COLORS[k] || MODALITY_COLORS[(k||"").toLowerCase()] || "#475569";
    const humanMod = s  => { if (s === "adc") return "ADC"; return (s||"Unknown").replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase()); };

    // ─────────────────────────────────────────────────────────────────────
    // Shared primitives
    // ─────────────────────────────────────────────────────────────────────

    const MonoLabel = ({ children, color = "var(--muted)", style = {} }) => (
      <div style={{ fontFamily:"var(--fm)", fontSize:10, letterSpacing:"0.14em",
        color, textTransform:"uppercase", marginBottom:14, ...style }}>
        {children}
      </div>
    );

    const Badge = ({ label, color }) => (
      <span style={{ fontFamily:"var(--fm)", fontSize:10, padding:"2px 8px",
        borderRadius:10, color, background:color+"18",
        border:`1px solid ${color}30`, whiteSpace:"nowrap" }}>
        {label}
      </span>
    );

    // Collapsible card wrapper
    function Card({ id, question, vizType, color, children, defaultOpen = false }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div style={{ borderRadius:10, border:`1px solid ${open ? color.accent+"40" : "var(--border)"}`,
          background:"var(--surf)", overflow:"hidden", transition:"border-color 0.2s" }}>
          <div onClick={() => setOpen(o => !o)}
            style={{ padding:"16px 20px", cursor:"pointer",
              display:"flex", alignItems:"flex-start", gap:12 }}>
            <div style={{ flex:1 }}>
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:color.mid,
                letterSpacing:"0.12em", marginBottom:6 }}>
                {id.toUpperCase()}
              </div>
              <div style={{ fontSize:14, fontWeight:500, color:"var(--text)", lineHeight:1.45 }}>
                {question}
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexShrink:0 }}>
              <Badge label={vizType} color={color.accent} />
              <span style={{ color:"var(--muted)", fontSize:14, display:"inline-block",
                transition:"transform 0.2s",
                transform: open ? "rotate(180deg)" : "rotate(0deg)" }}>▾</span>
            </div>
          </div>
          {open && (
            <div style={{ padding:"0 20px 20px",
              borderTop:`1px solid ${color.accent}20` }}>
              {children}
            </div>
          )}
        </div>
      );
    }

    // Dimmed non-interactive card for questions not yet implemented
    function Placeholder({ id, question, vizType, color }) {
      return (
        <div style={{ borderRadius:10, border:"1px solid var(--border)",
          background:"var(--surf)", padding:"16px 20px", opacity:0.45 }}>
          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12 }}>
            <div>
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:color.mid,
                letterSpacing:"0.12em", marginBottom:6 }}>
                {id.toUpperCase()}
              </div>
              <div style={{ fontSize:14, fontWeight:500, color:"var(--text)", lineHeight:1.45 }}>
                {question}
              </div>
            </div>
            <Badge label={vizType} color={color.accent} />
          </div>
          <div style={{ marginTop:14, fontFamily:"var(--fm)", fontSize:10,
            color:"var(--dim)", letterSpacing:"0.1em" }}>
            — PENDING IMPLEMENTATION —
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Question components — injected here by generate_weekly_viz.py
    // ─────────────────────────────────────────────────────────────────────

    /* __COMPONENTS_PLACEHOLDER__ */

    // ─────────────────────────────────────────────────────────────────────
    // Weekly team view containers
    // Add new question Cards here as new wq files are implemented.
    // ─────────────────────────────────────────────────────────────────────

    function WeeklyBD({ data, color }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Card id="bd_wq1" color={color} defaultOpen
            question="Which sponsors filed new trials this week that we should contact?"
            vizType="Action Table with Priority Score">
            <WQ1ActionTable data={data?.wq1} color={color} />
          </Card>

          <Placeholder id="bd_wq2" color={color}
            question="Are any of our existing clients filing new trials we should know about?"
            vizType="Client Alert Cards" />

          <Placeholder id="bd_wq3" color={color}
            question="What's the competitive landscape signal this week?"
            vizType="Deviation Bars (this week vs. 4-week average)" />
        </div>
      );
    }

    function WeeklyMarketing({ data, color }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Card id="mk_wq1" color={color} defaultOpen
            question="What's the headline stat for this week's social/newsletter content?"
            vizType="Social-Ready Stat Cards">
            <WQ4StatCards data={data?.wq4} color={color} />
          </Card>

          <Placeholder id="mk_wq2" color={color}
            question="Are there trending modalities or TAs we should write about?"
            vizType="Over/Under Index Chart" />

          <Placeholder id="mk_wq3" color={color}
            question="Which conference-relevant TAs had notable activity this week?"
            vizType="Conference Prep Snapshot" />
        </div>
      );
    }

    function WeeklyScientific({ data, color }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Card id="sci_wq1" color={color} defaultOpen
            question="Where is new drug trial activity clustering this week, and how does it compare to our baseline?"
            vizType="TA × Modality Bubble Matrix">
            <WQ7BubbleMatrix data={data?.wq7} color={color} />
          </Card>

          <Placeholder id="sci_wq2" color={color}
            question="How many trials landed in base_only this week, and why?"
            vizType="Classification Gap Report (table + word cloud)" />

          <Placeholder id="sci_wq3" color={color}
            question="What's the MeSH coverage quality for this week's trials?"
            vizType="MeSH Quality Waterfall" />
        </div>
      );
    }

    function WeeklyOperations({ data, color }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Card id="ops_wq1" color={color} defaultOpen
            question="What is the new drug trial velocity this week vs. recent weeks?"
            vizType="Velocity Dashboard (4 tiles)">
            <WQ10VelocityDashboard data={data?.wq10} color={color} />
          </Card>

          <Placeholder id="ops_wq2" color={color}
            question="What complexity mix is arriving this week?"
            vizType="Waffle Chart (complexity-weighted)" />

          <Placeholder id="ops_wq3" color={color}
            question="Which Phase 1 trials arrived this week? (earliest capacity signal)"
            vizType="Phase 1 Intake List" />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Quarterly view — all placeholders until quarterly functions are built
    // ─────────────────────────────────────────────────────────────────────

    const QUARTERLY_CARDS = {
      BD: [
        { id:"sq1", question:"How large is our total addressable market by modality and phase?",       vizType:"Bubble Matrix" },
        { id:"sq2", question:"Who are the top 25 sponsors and what do they run?",                      vizType:"Ranked Bar + Stacked Modality" },
        { id:"sq3", question:"Which therapeutic areas are growing or shrinking year-over-year?",       vizType:"Area Chart" },
      ],
      Marketing: [
        { id:"sq4", question:"What is the current modality landscape for thought leadership content?", vizType:"Donut Chart with Callout Cards" },
        { id:"sq5", question:"What TA-specific narratives can we build for targeted campaigns?",       vizType:"TA Fact Sheet Grid" },
        { id:"sq6", question:"How does our capability map align with market demand?",                  vizType:"Gap Analysis Side-by-Side Bars" },
      ],
      Scientific: [
        { id:"sq7", question:"What assay platforms should we invest in for the next 12–24 months?",   vizType:"Pipeline Horizon Chart" },
        { id:"sq8", question:"Which TA × modality intersections drive the most bioanalytical complexity?", vizType:"Heatmap Matrix" },
        { id:"sq9", question:"How reliable is our classification, and where should we improve?",       vizType:"Confidence Dashboard" },
      ],
      Operations: [
        { id:"sq10", question:"What is the total workload forecast by complexity tier?",               vizType:"Dual-Axis Volume vs. Weighted Workload" },
        { id:"sq11", question:"How should we allocate analysts across TAs and platforms?",             vizType:"Sunburst Diagram" },
        { id:"sq12", question:"What is the phase transition pipeline — what's coming in 1, 2, 3 years?", vizType:"Demand Wave / Sankey" },
      ],
    };

    function QuarterlyView({ team, color }) {
      const cards = QUARTERLY_CARDS[team] || [];
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {cards.map(c => {
            // BD sq2: render real component if data is available
            if (c.id === "sq2" && ALEXIS_DATA.sq2?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ2TopSponsors data={ALEXIS_DATA.sq2} color={color} />
                </Card>
              );
            }
            // MK sq1 (sq4): modality landscape
            if (c.id === "sq4" && ALEXIS_DATA.sq4?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ1ModalityLandscape data={ALEXIS_DATA.sq4} color={color} />
                </Card>
              );
            }
            // SCI sq9: confidence dashboard
            if (c.id === "sq9" && ALEXIS_DATA.sq9?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ9ConfidenceDashboard data={ALEXIS_DATA.sq9} color={color} />
                </Card>
              );
            }
            // SCI sq8: biomarker × TA heatmap
            if (c.id === "sq8" && ALEXIS_DATA.sq8?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ8BiomarkerMatrix data={ALEXIS_DATA.sq8} color={color} />
                </Card>
              );
            }
            // OPS sq10: workload forecast
            if (c.id === "sq10" && ALEXIS_DATA.sq10?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ10WorkloadForecast data={ALEXIS_DATA.sq10} color={color} />
                </Card>
              );
            }
            // All other quarterly questions remain as placeholder
            return <Placeholder key={c.id} color={color} {...c} />;
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Layout components
    // ─────────────────────────────────────────────────────────────────────

    function Header({ meta, isReclassified, generatedAt }) {
      return (
        <div style={{ borderBottom:"1px solid var(--border)", background:"var(--surf)",
          position:"sticky", top:0, zIndex:100, padding:"0 32px" }}>
          <div style={{ maxWidth:1100, margin:"0 auto", display:"flex",
            alignItems:"center", gap:20, height:52 }}>
            <span style={{ fontFamily:"var(--fh)", fontSize:20, fontWeight:700,
              letterSpacing:"0.08em", color:"var(--cyan)" }}>
              ALEXIS
            </span>
            <span style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
              letterSpacing:"0.14em" }}>
              BUSINESS INTELLIGENCE
            </span>
            {meta?.window_start && (
              <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--dim)" }}>
                {meta.window_start} → {meta.window_end}
              </div>
            )}
            <div style={{ flex:1 }} />
            <div style={{ fontFamily:"var(--fm)", fontSize:10,
              color: isReclassified ? "var(--green)" : "var(--amber)",
              background: isReclassified ? "rgba(34,197,94,0.08)" : "rgba(245,158,11,0.08)",
              border:`1px solid ${isReclassified ? "#22C55E" : "#F59E0B"}30`,
              borderRadius:4, padding:"3px 8px" }}>
              {isReclassified ? "RECLASSIFIED" : "RAW"}
            </div>
            {generatedAt && (
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--dim)" }}>
                {generatedAt.slice(0,10)}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ViewToggle({ view, setView }) {
      const opts = [
        { key:"weekly",    icon:"⚡", tag:"TACTICAL",  tagColor:"#F59E0B",
          label:"Weekly Pulse",
          purpose:"What happened THIS WEEK? What should we act on NOW?" },
        { key:"quarterly", icon:"📊", tag:"STRATEGIC", tagColor:"#3B82F6",
          label:"Quarterly / Yearly",
          purpose:"Where is the market? How big is it? Where should we invest?" },
      ];
      return (
        <div style={{ display:"flex", gap:10, marginBottom:22 }}>
          {opts.map(o => (
            <div key={o.key} onClick={() => setView(o.key)}
              style={{ flex:1, borderRadius:8, padding:"14px 18px", cursor:"pointer",
                border:`1px solid ${view===o.key ? o.tagColor+"50" : "var(--border)"}`,
                background: view===o.key ? "var(--surf2)" : "transparent",
                transition:"all 0.15s" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                <span style={{ fontSize:16 }}>{o.icon}</span>
                <span style={{ fontFamily:"var(--fm)", fontSize:9, padding:"1px 6px",
                  borderRadius:3, background:o.tagColor+"20", color:o.tagColor,
                  letterSpacing:"0.12em" }}>
                  {o.tag}
                </span>
              </div>
              <div style={{ fontSize:13, fontWeight:600, color:"var(--text)", marginBottom:2 }}>
                {o.label}
              </div>
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
                lineHeight:1.5 }}>
                {o.purpose}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function TeamTabs({ team, setTeam }) {
      return (
        <div style={{ display:"flex", gap:4, background:"var(--surf2)",
          borderRadius:8, padding:4, marginBottom:20 }}>
          {Object.entries(TEAM_CFG).map(([key, cfg]) => {
            const active = team === key;
            return (
              <button key={key} onClick={() => setTeam(key)}
                style={{ flex:1, padding:"8px 12px", borderRadius:5, border:"none",
                  cursor:"pointer", fontFamily:"var(--fb)", fontSize:13, fontWeight:600,
                  transition:"all 0.15s",
                  background: active ? cfg.accent+"20" : "transparent",
                  color: active ? cfg.mid : "var(--muted)",
                  borderBottom:`2px solid ${active ? cfg.accent : "transparent"}` }}>
                {key}
              </button>
            );
          })}
        </div>
      );
    }

    function SourceBar({ view, snapshotFile, enrichedCounts, changelogAvailable }) {
      const ec = enrichedCounts || {};
      return (
        <div style={{ marginBottom:20, padding:"10px 14px", borderRadius:6,
          background:"var(--surf2)", border:"1px solid var(--border)",
          fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
          display:"flex", gap:20, flexWrap:"wrap", alignItems:"center" }}>
          <span>
            <span style={{ color:"var(--dim)" }}>SOURCE </span>
            {view==="weekly" ? "Pulse snapshot + enriched changelog" : "Master DB (active universe)"}
          </span>
          {snapshotFile && (
            <span>
              <span style={{ color:"var(--dim)" }}>FILE </span>
              <code style={{ color:"var(--cyan)" }}>{snapshotFile}</code>
            </span>
          )}
          {view==="weekly" && ec.available && (
            <span style={{ color:"var(--green)" }}>
              ✓ enriched: {fmt(ec.new)} new · {fmt(ec.existing)} updated
            </span>
          )}
          {view==="weekly" && !ec.available && (
            <span style={{ color:"var(--amber)" }}>⚠ enriched file not loaded</span>
          )}
          {view==="weekly" && (
            <span style={{ color: changelogAvailable ? "var(--green)" : "var(--amber)" }}>
              {changelogAvailable ? "✓ changelog loaded" : "⚠ no changelog"}
            </span>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // App root
    // ─────────────────────────────────────────────────────────────────────

    function App() {
      const [view, setView] = useState("weekly");
      const [team, setTeam] = useState("BD");

      if (!ALEXIS_DATA || typeof ALEXIS_DATA !== "object") {
        return (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center",
            minHeight:"100vh", flexDirection:"column", gap:16 }}>
            <div style={{ fontFamily:"var(--fm)", fontSize:14, color:"var(--amber)" }}>
              ⚠ No data injected
            </div>
            <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)",
              maxWidth:440, textAlign:"center", lineHeight:1.8 }}>
              Run{" "}
              <code style={{ color:"var(--cyan)" }}>
                python pipelines/generate_weekly_viz.py
              </code>
              {" "}from the ALEXIS project root to generate{" "}
              <code style={{ color:"var(--cyan)" }}>
                viz/alexis_weekly_dashboard_live.html
              </code>.
            </div>
          </div>
        );
      }

      const { metadata, changelog, enriched_counts,
              is_reclassified, generated_at, snapshot_file } = ALEXIS_DATA;
      const color = TEAM_CFG[team];

      function renderCards() {
        if (view === "quarterly") return <QuarterlyView team={team} color={color} />;
        if (team === "BD")         return <WeeklyBD data={ALEXIS_DATA} color={color} />;
        if (team === "Marketing")  return <WeeklyMarketing data={ALEXIS_DATA} color={color} />;
        if (team === "Scientific") return <WeeklyScientific data={ALEXIS_DATA} color={color} />;
        if (team === "Operations") return <WeeklyOperations data={ALEXIS_DATA} color={color} />;
      }

      return (
        <div style={{ minHeight:"100vh" }}>
          <Header meta={metadata} isReclassified={is_reclassified}
            generatedAt={generated_at} />

          <div style={{ maxWidth:1100, margin:"0 auto", padding:"28px 32px 64px" }}>

            <div style={{ marginBottom:24 }}>
              <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
                letterSpacing:"0.18em", marginBottom:6 }}>
                ALEXIS → BUSINESS INTELLIGENCE
              </div>
              <h1 style={{ fontFamily:"var(--fh)", fontSize:28, fontWeight:700,
                color:"var(--text)", letterSpacing:"0.02em", marginBottom:4 }}>
                Dashboard: Two Views
              </h1>
              <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
                24 business questions · each mapped to exact data fields and visualizations
              </div>
            </div>

            <ViewToggle view={view} setView={setView} />

            <SourceBar view={view} snapshotFile={snapshot_file}
              enrichedCounts={enriched_counts}
              changelogAvailable={changelog?.available} />

            <TeamTabs team={team} setTeam={setTeam} />

            {renderCards()}

            <div style={{ marginTop:48, paddingTop:20,
              borderTop:"1px solid var(--border)",
              display:"flex", gap:24, flexWrap:"wrap",
              fontFamily:"var(--fm)", fontSize:10, color:"var(--dim)" }}>
              <span>Source: ClinicalTrials.gov via AACT</span>
              <span>{snapshot_file}</span>
              <span style={{ flex:1, textAlign:"right", color:"var(--muted)" }}>
                Manual inputs needed:{" "}
                <span style={{ color:"var(--dim)" }}>
                  capability_score (sq6) · complexity_weight (sq10/ops_wq2) · client_list (bd_wq2)
                </span>
              </span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
