  const { sparkline, cur_drug_new, prior_avg_drug, pace_delta_pct,
          ta_top, ta_bars, mod_bars, phase1, phase_breakdown, has_prior, n_prior_weeks } = data;

  const ac = color.mid;

  let paceCopy = null;
  if (has_prior && pace_delta_pct != null) {
    const abs = Math.abs(pace_delta_pct);
    const dir = pace_delta_pct >= 0 ? "above" : "below";
    const col = pace_delta_pct >= 5  ? "#EF4444"
              : pace_delta_pct <= -5 ? "#60A5FA"
              : "var(--muted)";
    paceCopy = (
      <span style={{ fontFamily:"var(--fm)", fontSize:11, fontWeight:600, color:col }}>
        {pace_delta_pct >= 0 ? "▲" : "▼"} {abs.toFixed(1)}% {dir} {n_prior_weeks}-week avg
      </span>
    );
  }

  const tileStyle = {
    background:"var(--surf2)", border:"1px solid var(--border)",
    borderRadius:10, padding:"16px 18px",
    display:"flex", flexDirection:"column",
  };
  const tileTitle = txt => (
    <div style={{ fontFamily:"var(--fm)", fontSize:9, letterSpacing:"0.12em",
      color:"var(--dim)", marginBottom:10, textTransform:"uppercase" }}>
      {txt}
    </div>
  );

  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gridAutoRows:"1fr", gap:14 }}>

      {/* Tile 1: Sparkline */}
      <div style={tileStyle}>
        {tileTitle("New Drug Registrations")}
        <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:6 }}>
          <span style={{ fontFamily:"var(--fm)", fontSize:28,
            fontWeight:700, color:ac, lineHeight:1 }}>
            {fmt(cur_drug_new)}
          </span>
          {has_prior && prior_avg_drug != null && (
            <span style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
              avg {prior_avg_drug.toFixed(1)}
            </span>
          )}
        </div>
        {paceCopy}
        {sparkline && (
          <div style={{ flex:1, minHeight:60, marginTop:10 }}>
            <MiniSparkline points={sparkline} accentColor={ac}
              width={230} height={68} fluid />
          </div>
        )}
        {/* Top TAs this week (by absolute count, not deviation) */}
        {ta_top?.length > 0 && (
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:10,
            borderTop:"1px solid var(--border)", paddingTop:10 }}>
            {ta_top.slice(0, 6).map(t => (
              <span key={t.label} style={{ fontFamily:"var(--fm)", fontSize:9,
                color:"var(--muted)", background:"var(--surf3)",
                border:"1px solid var(--border)", borderRadius:4, padding:"2px 7px" }}>
                {t.label} <span style={{ color:ac, fontWeight:600 }}>{t.count}</span>
              </span>
            ))}
          </div>
        )}
      </div>

      {/* Tile 2: TA % change */}
      <div style={tileStyle}>
        {tileTitle("Top / Bottom TA vs Avg")}
        <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"center" }}>
          {has_prior ? (
            <DivergingBars bars={ta_bars} accentColor={ac} labelFn={l => l} />
          ) : (
            <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
              Load prior weeks to enable comparison.
            </div>
          )}
        </div>
      </div>

      {/* Tile 3: Modality % change */}
      <div style={tileStyle}>
        {tileTitle("Top / Bottom Modality vs Avg")}
        <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"center" }}>
          {has_prior ? (
            <DivergingBars bars={mod_bars} accentColor={ac} labelFn={l => humanMod(l)} />
          ) : (
            <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
              Load prior weeks to enable comparison.
            </div>
          )}
        </div>
      </div>

      {/* Tile 4: Phase 1 intake + phase breakdown */}
      <div style={tileStyle}>
        {tileTitle("Phase 1 Intake Rate")}
        <div style={{ flex:1 }}>
          <Phase1Gauge data={phase1} accentColor={ac} />
          {!phase1?.has_prior && (
            <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)", marginTop:6 }}>
              Avg comparison requires enriched files for prior weeks.
            </div>
          )}
        </div>
        {/* Phase breakdown mini bars */}
        {phase_breakdown?.length > 0 && (() => {
          const maxN = Math.max(...phase_breakdown.map(p => p.count), 1);
          return (
            <div style={{ borderTop:"1px solid var(--border)", paddingTop:10, marginTop:10 }}>
              <div style={{ fontFamily:"var(--fm)", fontSize:8, color:"var(--dim)",
                letterSpacing:"0.12em", marginBottom:6, textTransform:"uppercase" }}>
                All Phases This Week
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {phase_breakdown.map(p => (
                  <div key={p.phase} style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <div style={{ width:72, flexShrink:0, fontFamily:"var(--fm)", fontSize:9,
                      color: p.is_p1 ? ac : "var(--muted)",
                      fontWeight: p.is_p1 ? 600 : 400,
                      textAlign:"right" }}>
                      {p.phase}
                    </div>
                    <div style={{ flex:1, height:6, background:"var(--border)", borderRadius:3 }}>
                      <div style={{ width:`${(p.count / maxN * 100)}%`, height:"100%",
                        background: p.is_p1 ? ac : "var(--muted)",
                        borderRadius:3, opacity:0.7, transition:"width 0.3s" }} />
                    </div>
                    <div style={{ width:30, flexShrink:0, fontFamily:"var(--fm)", fontSize:9,
                      color:"var(--text)", fontWeight:600, textAlign:"right" }}>
                      {p.count}
                    </div>
                    <div style={{ width:32, flexShrink:0, fontFamily:"var(--fm)", fontSize:8,
                      color:"var(--dim)", textAlign:"right" }}>
                      {p.pct}%
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </div>

    </div>
  );
}

            if (c.id === "sq12" && ALEXIS_DATA.sq12?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ12TransitionPipeline data={ALEXIS_DATA.sq12} color={color} />
                </Card>
              );
            }
            // OPS sq10: workload forecast
            if (c.id === "sq10" && ALEXIS_DATA.sq10?.available) {
              return (
                <Card key={c.id} id={c.id} color={color} defaultOpen
                  question={c.question} vizType={c.vizType}>
                  <SQ10WorkloadForecast data={ALEXIS_DATA.sq10} color={color} />
                </Card>
              );
            }
            // All other quarterly questions remain as placeholder
            return <Placeholder key={c.id} color={color} {...c} />;
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Layout components
    // ─────────────────────────────────────────────────────────────────────

    function Header({ meta, isReclassified, generatedAt }) {
      return (
        <div style={{ borderBottom:"1px solid var(--border)", background:"var(--surf)",
          position:"sticky", top:0, zIndex:100, padding:"0 32px" }}>
          <div style={{ maxWidth:1100, margin:"0 auto", display:"flex",
            alignItems:"center", gap:20, height:52 }}>
            <span style={{ fontFamily:"var(--fh)", fontSize:20, fontWeight:700,
              letterSpacing:"0.08em", color:"var(--cyan)" }}>
              ALEXIS
            </span>
            <span style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
              letterSpacing:"0.14em" }}>
              BUSINESS INTELLIGENCE
            </span>
            {meta?.window_start && (
              <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--dim)" }}>
                {meta.window_start} → {meta.window_end}
              </div>
            )}
            <div style={{ flex:1 }} />
            <div style={{ fontFamily:"var(--fm)", fontSize:10,
              color: isReclassified ? "var(--green)" : "var(--amber)",
              background: isReclassified ? "rgba(34,197,94,0.08)" : "rgba(245,158,11,0.08)",
              border:`1px solid ${isReclassified ? "#22C55E" : "#F59E0B"}30`,
              borderRadius:4, padding:"3px 8px" }}>
              {isReclassified ? "RECLASSIFIED" : "RAW"}
            </div>
            {generatedAt && (
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--dim)" }}>
                {generatedAt.slice(0,10)}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ViewToggle({ view, setView }) {
      const opts = [
        { key:"weekly",    icon:"⚡", tag:"TACTICAL",  tagColor:"#F59E0B",
          label:"Weekly Pulse",
          purpose:"What happened THIS WEEK? What should we act on NOW?" },
        { key:"quarterly", icon:"📊", tag:"STRATEGIC", tagColor:"#3B82F6",
          label:"Quarterly / Yearly",
          purpose:"Where is the market? How big is it? Where should we invest?" },
        { key:"chictr",    icon:"🕊", tag:"CHINA",     tagColor:"#E11D48",
          label:"ChiCTR",
          purpose:"Chinese trial registry this week (ML-classified)" },
        { key:"anzctr",    icon:"🦘", tag:"AUSTRALIA", tagColor:"#16A34A",
          label:"ANZCTR",
          purpose:"Australian & NZ trial registry — foreign-sponsored FIH focus (ML-classified)" },
      ];
      return (
        <div style={{ display:"flex", gap:10, marginBottom:22 }}>
          {opts.map(o => (
            <div key={o.key} onClick={() => setView(o.key)}
              style={{ flex:1, borderRadius:8, padding:"14px 18px", cursor:"pointer",
                border:`1px solid ${view===o.key ? o.tagColor+"50" : "var(--border)"}`,
                background: view===o.key ? "var(--surf2)" : "transparent",
                transition:"all 0.15s" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                <span style={{ fontSize:16 }}>{o.icon}</span>
                <span style={{ fontFamily:"var(--fm)", fontSize:9, padding:"1px 6px",
                  borderRadius:3, background:o.tagColor+"20", color:o.tagColor,
                  letterSpacing:"0.12em" }}>
                  {o.tag}
                </span>
              </div>
              <div style={{ fontSize:13, fontWeight:600, color:"var(--text)", marginBottom:2 }}>
                {o.label}
              </div>
              <div style={{ fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
                lineHeight:1.5 }}>
                {o.purpose}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function TeamTabs({ team, setTeam }) {
      return (
        <div style={{ display:"flex", gap:4, background:"var(--surf2)",
          borderRadius:8, padding:4, marginBottom:20 }}>
          {Object.entries(TEAM_CFG).map(([key, cfg]) => {
            const active = team === key;
            return (
              <button key={key} onClick={() => setTeam(key)}
                style={{ flex:1, padding:"8px 12px", borderRadius:5, border:"none",
                  cursor:"pointer", fontFamily:"var(--fb)", fontSize:13, fontWeight:600,
                  transition:"all 0.15s",
                  background: active ? cfg.accent+"20" : "transparent",
                  color: active ? cfg.mid : "var(--muted)",
                  borderBottom:`2px solid ${active ? cfg.accent : "transparent"}` }}>
                {key}
              </button>
            );
          })}
        </div>
      );
    }

    function SourceBar({ view, snapshotFile, enrichedCounts, changelogAvailable }) {
      const ec = enrichedCounts || {};
      return (
        <div style={{ marginBottom:20, padding:"10px 14px", borderRadius:6,
          background:"var(--surf2)", border:"1px solid var(--border)",
          fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)",
          display:"flex", gap:20, flexWrap:"wrap", alignItems:"center" }}>
          <span>
            <span style={{ color:"var(--dim)" }}>SOURCE </span>
            {view==="weekly"  ? "Pulse snapshot + enriched changelog"
             : view==="chictr" ? "ChiCTR snapshot + weekly diff (ML-classified)"
             : view==="anzctr" ? "ANZCTR snapshot + monthly diff (ML-classified)"
             : "Master DB (active universe)"}
          </span>
          {snapshotFile && view!=="chictr" && view!=="anzctr" && (
            <span>
              <span style={{ color:"var(--dim)" }}>FILE </span>
              <code style={{ color:"var(--cyan)" }}>{snapshotFile}</code>
            </span>
          )}
          {view==="chictr" && ALEXIS_DATA?.chictr_metadata?.snapshot_file && (
            <span>
              <span style={{ color:"var(--dim)" }}>FILE </span>
              <code style={{ color:"#E11D48" }}>{ALEXIS_DATA.chictr_metadata.snapshot_file}</code>
            </span>
          )}
          {view==="anzctr" && ALEXIS_DATA?.anzctr_metadata?.snapshot_file && (
            <span>
              <span style={{ color:"var(--dim)" }}>FILE </span>
              <code style={{ color:"#16A34A" }}>{ALEXIS_DATA.anzctr_metadata.snapshot_file}</code>
            </span>
          )}
          {view==="weekly" && ec.available && (
            <span style={{ color:"var(--green)" }}>
              ✓ enriched: {fmt(ec.new)} new · {fmt(ec.existing)} updated
            </span>
          )}
          {view==="weekly" && !ec.available && (
            <span style={{ color:"var(--amber)" }}>⚠ enriched file not loaded</span>
          )}
          {view==="weekly" && (
            <span style={{ color: changelogAvailable ? "var(--green)" : "var(--amber)" }}>
              {changelogAvailable ? "✓ changelog loaded" : "⚠ no changelog"}
            </span>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // App root
    // ─────────────────────────────────────────────────────────────────────

    function App() {
      const [view, setView] = useState("weekly");
      const [team, setTeam] = useState("BD");

      if (!ALEXIS_DATA || typeof ALEXIS_DATA !== "object") {
        return (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center",
            minHeight:"100vh", flexDirection:"column", gap:16 }}>
            <div style={{ fontFamily:"var(--fm)", fontSize:14, color:"var(--amber)" }}>
              ⚠ No data injected
            </div>
            <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)",
              maxWidth:440, textAlign:"center", lineHeight:1.8 }}>
              Run{" "}
              <code style={{ color:"var(--cyan)" }}>
                python pipelines/generate_weekly_viz.py
              </code>
              {" "}from the ALEXIS project root to generate{" "}
              <code style={{ color:"var(--cyan)" }}>
                viz/alexis_weekly_dashboard_live.html
              </code>.
            </div>
          </div>
        );
      }

      const { metadata, changelog, enriched_counts,
              is_reclassified, generated_at, snapshot_file } = ALEXIS_DATA;
      const color = TEAM_CFG[team];

      function renderCards() {
        if (view === "quarterly") return <QuarterlyView team={team} color={color} />;
        if (view === "chictr") {
          if (team === "BD")         return <ChictrBD data={ALEXIS_DATA} color={color} />;
          if (team === "Marketing")  return <ChictrMarketing data={ALEXIS_DATA} color={color} />;
          if (team === "Scientific") return <ChictrScientific data={ALEXIS_DATA} color={color} />;
          if (team === "Operations") return <ChictrOperations data={ALEXIS_DATA} color={color} />;
        }
        if (view === "anzctr") {
          if (team === "BD")         return <AnzctrBD data={ALEXIS_DATA} color={color} />;
          if (team === "Marketing")  return <AnzctrMarketing data={ALEXIS_DATA} color={color} />;
          if (team === "Scientific") return <AnzctrScientific data={ALEXIS_DATA} color={color} />;
          if (team === "Operations") return <AnzctrOperations data={ALEXIS_DATA} color={color} />;
        }
        if (team === "BD")         return <WeeklyBD data={ALEXIS_DATA} color={color} />;
        if (team === "Marketing")  return <WeeklyMarketing data={ALEXIS_DATA} color={color} />;
        if (team === "Scientific") return <WeeklyScientific data={ALEXIS_DATA} color={color} />;
        if (team === "Operations") return <WeeklyOperations data={ALEXIS_DATA} color={color} />;
      }

      return (
        <div style={{ minHeight:"100vh" }}>
          <Header meta={metadata} isReclassified={is_reclassified}
            generatedAt={generated_at} />

          <div style={{ maxWidth:1100, margin:"0 auto", padding:"28px 32px 64px" }}>

            <div style={{ marginBottom:24 }}>
              <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
                letterSpacing:"0.18em", marginBottom:6 }}>
                ALEXIS → BUSINESS INTELLIGENCE
              </div>
              <h1 style={{ fontFamily:"var(--fh)", fontSize:28, fontWeight:700,
                color:"var(--text)", letterSpacing:"0.02em", marginBottom:4 }}>
                Dashboard: Two Views
              </h1>
              <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
                24 business questions · each mapped to exact data fields and visualizations
              </div>
            </div>

            <ViewToggle view={view} setView={setView} />

            <SourceBar view={view} snapshotFile={snapshot_file}
              enrichedCounts={enriched_counts}
              changelogAvailable={changelog?.available} />

            <TeamTabs team={team} setTeam={setTeam} />

            {renderCards()}

            <div style={{ marginTop:48, paddingTop:20,
              borderTop:"1px solid var(--border)",
              display:"flex", gap:24, flexWrap:"wrap",
              fontFamily:"var(--fm)", fontSize:10, color:"var(--dim)" }}>
              <span>Source: ClinicalTrials.gov via AACT</span>
              <span>{snapshot_file}</span>
              <span style={{ flex:1, textAlign:"right", color:"var(--muted)" }}>
                Manual inputs needed:{" "}
                <span style={{ color:"var(--dim)" }}>
                  capability_score (sq6) · complexity_weight (sq10/ops_wq2) · client_list (bd_wq2)
                </span>
              </span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Bootstrap: compile the app with the CLASSIC JSX runtime (React.createElement,
       no module imports) and execute it. Runs after babel.min.js (loaded in head). -->
  <script>
    (function () {
      var src = document.getElementById("alexis-app-src");
      if (!src) return;
      try {
        var out = Babel.transform(src.textContent, {
          presets: [["react", { runtime: "classic" }]]
        }).code;
        var s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
      } catch (e) {
        var root = document.getElementById("root");
        if (root) {
          root.innerHTML =
            '<div style="padding:32px;font-family:monospace;color:#EF4444">' +
            'Dashboard failed to compile: ' + String(e) + '</div>';
        }
        if (window.console) console.error(e);
      }
    })();
  </script>
</body>
</html>
