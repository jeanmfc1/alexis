function exportCSV(rows) {
  const headers = ["sponsor_name","new_trial_count","modalities","top_phase","priority_score","priority_label"];
  const lines = [
    headers.join(","),
    ...rows.map(r => [
      `"${r.sponsor_name}"`,
      r.new_trial_count,
      `"${(r.modalities||[]).join("; ")}"`,
      r.top_phase || "",
      r.priority_score,
      r.priority_label,
    ].join(","))
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bd_wq1_sponsor_action_table.csv";
  a.click();
}

                            <tr>
                              {SUB_COLS.map(h => {
                                const active = ss.col === h.col;
                                return (
                                  <th key={h.col} onClick={() => toggleSubSort(h.col)}
                                    style={{ padding:"6px 8px", textAlign:"left",
                                      fontFamily:"var(--fm)", fontSize:9,
                                      color: active ? color.mid : "var(--dim)",
                                      letterSpacing:"0.12em", cursor:"pointer",
                                      userSelect:"none", whiteSpace:"nowrap",
                                      width: h.width,
                                      borderBottom:`1px solid ${active ? color.accent : "var(--border)"}` }}>
                                    {h.label}{active ? (ss.dir === -1 ? " ↓" : " ↑") : ""}
                                  </th>
                                );
                              })}
                            </tr>
                          </thead>
                          <tbody>
                            {sortedTrials.map((t, ti) => {
                              const dead = ["COMPLETED","TERMINATED","WITHDRAWN","SUSPENDED"]
                                .includes(t.overall_status);
                              return (
                              <tr key={t.nct_id || ti}
                                style={{ borderTop:"1px solid var(--border)",
                                  opacity: dead ? 0.55 : 1 }}>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--cyan)", whiteSpace:"nowrap" }}>
                                  <a href={`https://clinicaltrials.gov/expert-search?term=${t.nct_id}`}
                                     target="_blank" rel="noopener noreferrer"
                                     style={{ color:"var(--cyan)", textDecoration:"none" }}
                                     onMouseOver={e => e.target.style.textDecoration="underline"}
                                     onMouseOut={e  => e.target.style.textDecoration="none"}>
                                    {t.nct_id}
                                  </a>
                                </td>
                                <td style={{ padding:"5px 8px", fontSize:12,
                                  color:"var(--text)", maxWidth:340,
                                  overflow:"hidden", textOverflow:"ellipsis",
                                  whiteSpace:"nowrap" }}
                                  title={t.title}>
                                  {t.title}
                                </td>
                                <td style={{ padding:"5px 8px" }}>
                                  <span style={{ fontFamily:"var(--fm)", fontSize:10,
                                    padding:"2px 6px", borderRadius:8,
                                    color: statusColor(t.overall_status),
                                    background: statusColor(t.overall_status) + "18",
                                    border: `1px solid ${statusColor(t.overall_status)}30`,
                                    whiteSpace:"nowrap" }}>
                                    {humanStatus(t.overall_status)}
                                  </span>
                                </td>
                                <td style={{ padding:"5px 8px" }}>
                                  <span style={{ fontFamily:"var(--fm)", fontSize:10,
                                    padding:"2px 6px", borderRadius:8,
                                    background:modColor(t.modality)+"20",
                                    color:modColor(t.modality) }}>
                                    {humanMod(t.modality)}
                                  </span>
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:10,
                                  color:"var(--dim)", whiteSpace:"nowrap" }}>
                                  {(t.modality_source || "—").replace(/_/g," ")}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--muted)", whiteSpace:"nowrap" }}>
                                  {t.therapeutic_area || "—"}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:10,
                                  color:"var(--dim)", maxWidth:200,
                                  overflow:"hidden", textOverflow:"ellipsis",
                                  whiteSpace:"nowrap" }}
                                  title={Array.isArray(t.ta_evidence) ? t.ta_evidence.join("; ") : (t.ta_evidence || "")}>
                                  {Array.isArray(t.ta_evidence) ? t.ta_evidence.join("; ") : (t.ta_evidence || "—")}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--muted)" }}>
                                  {t.phase || "—"}
                                </td>
                                <td style={{ padding:"5px 8px",
                                  fontFamily:"var(--fm)", fontSize:11,
                                  color:"var(--muted)", whiteSpace:"nowrap" }}>
                                  {t.first_posted_date || "—"}
                                </td>
                              </tr>
                              );
                            })}
                          </tbody>
                        </table>
                        </div>
                      </td>
                    </tr>
                    );
                  })()}

                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// -----------------------------------------------------------------------
// viz/bd_wq2.jsx
// BD / wq2 -- Client Trial Alert Cards
//
// Data source : ALEXIS_DATA.wq2  (from analytics/bd_wq2.py)
// Globals     : PRIORITY_CFG, modColor, humanMod
// -----------------------------------------------------------------------

const WQ2_TIER_COLOR = {
  high:   "#22C55E",   // green = high-confidence match
  medium: "#F59E0B",   // amber
  low:    "#64748B",   // slate = verify before trusting
};

function WQ2ClientAlerts({ data, color }) {
  if (!data || !data.available) {
    return (
      <div style={{ padding:"24px 16px", fontFamily:"var(--fm)",
        fontSize:12, color:"var(--muted)", textAlign:"center" }}>
        {data?.reason || "No client-list match for new trials this week."}
      </div>
    );
  }

  const [expanded, setExpanded] = useState({});
  const [confFilter, setConfFilter] = useState(null);
  const alerts = (data.alerts || []).filter(a =>
      !confFilter || a.match_confidence === confFilter);

  const toggle = (k) => setExpanded(e => ({ ...e, [k]: !e[k] }));

  const levelCounts = { HIGH: 0, MED: 0, LOW: 0 };
  (data.alerts || []).forEach(a => { levelCounts[a.alert_level]++; });

  const ModPill = ({ m }) => (
    <span style={{ fontFamily:"var(--fm)", fontSize:10, padding:"2px 6px",
      borderRadius:8, background:modColor(m)+"20", color:modColor(m),
      border:"1px solid "+modColor(m)+"30", whiteSpace:"nowrap" }}>
      {humanMod(m)}
    </span>
  );

  return (
    <div style={{ padding:"0 12px" }}>
      {/* Header strip */}
      <div style={{ display:"flex", gap:10, marginBottom:14 }}>
        {[
          {label:"NEW DRUG TRIALS", value:data.total_new_drug, tone:color.accent},
          {label:"MATCHED TO CLIENT", value:data.matched_trials, tone:"#22C55E"},
          {label:"UNMATCHED", value:data.unmatched_trials, tone:"var(--muted)"},
          {label:"CLIENT CORPUS", value:(data.meta?.client_corpus_size || 0).toLocaleString(), tone:"var(--muted)"},
        ].map((k, i) => (
          <div key={i} style={{ flex:1, background:"var(--surf2)",
            border:"1px solid "+color.accent+"22", borderRadius:8,
            padding:"12px 14px" }}>
            <div style={{ fontFamily:"var(--fm)", fontSize:9,
              color:"var(--muted)", letterSpacing:"0.14em" }}>
              {k.label}
            </div>
            <div style={{ fontFamily:"var(--fh)", fontSize:22, fontWeight:700,
              color:k.tone, marginTop:2 }}>{k.value}</div>
          </div>
        ))}
      </div>

      {/* Filter strip */}
      <div style={{ display:"flex", alignItems:"center", gap:10,
        marginBottom:10, fontFamily:"var(--fm)", fontSize:10,
        color:"var(--muted)", letterSpacing:"0.06em" }}>
        <span>PRIORITY</span>
        {["HIGH","MED","LOW"].map(l => {
          const p = PRIORITY_CFG?.[l] || {};
          return (
            <span key={l} style={{ display:"inline-flex", gap:4, alignItems:"center" }}>
              <span style={{ width:8, height:8, borderRadius:2,
                background:p.color, display:"inline-block" }}/>
              {l} ({levelCounts[l]})
            </span>
          );
        })}
        <span style={{ color:"var(--dim)" }}>|</span>
        <span>MATCH CONFIDENCE</span>
        {["high","medium","low"].map(c => {
          const active = confFilter === c;
          return (
            <span key={c} onClick={() => setConfFilter(active ? null : c)}
              style={{ cursor:"pointer", padding:"2px 8px", borderRadius:10,
                background: active ? WQ2_TIER_COLOR[c]+"30" : WQ2_TIER_COLOR[c]+"14",
                border:"1px solid "+WQ2_TIER_COLOR[c]+(active?"60":"30"),
                color: active ? "var(--text)" : WQ2_TIER_COLOR[c],
                fontWeight: active ? 600 : 500 }}>
              {c}
            </span>
          );
        })}
      </div>

      {/* Alert cards */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr",
        gap:12 }}>
        {alerts.map(a => {
          const p = PRIORITY_CFG?.[a.alert_level] || {};
          const tierHue = WQ2_TIER_COLOR[a.match_confidence] || "#64748B";
          const isOpen = !!expanded[a.client_name];
          return (
            <div key={a.client_name} style={{ background:"var(--surf2)",
              border:"1px solid "+p.border, borderRadius:8,
              padding:"14px 16px", display:"flex",
              flexDirection:"column", gap:8 }}>
              {/* Header row */}
              <div style={{ display:"flex", alignItems:"flex-start",
                gap:10, justifyContent:"space-between" }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center",
                    gap:6, flexWrap:"wrap" }}>
                    <div style={{ fontFamily:"var(--fb)", fontSize:14,
                      fontWeight:600, color:"var(--text)" }}>
                      {a.client_name}
                    </div>
                    {a.client_country && (
                      <span style={{ fontFamily:"var(--fm)", fontSize:9,
                        color:"var(--muted)", padding:"1px 5px",
                        borderRadius:4, background:"var(--surf3)" }}>
                        {a.client_country}
                      </span>
                    )}
                    <span style={{ fontFamily:"var(--fm)", fontSize:9,
                      color: tierHue, padding:"1px 5px", borderRadius:4,
                      background: tierHue+"18",
                      border:"1px solid "+tierHue+"30" }}>
                      {a.match_confidence} match
                    </span>
                  </div>
                  {a.client_name_raw && (
                    <div style={{ fontFamily:"var(--fm)", fontSize:10,
                      color:"var(--muted)", marginTop:3 }}
                      title="Raw MDM entry (exact string from storage/List of MDM or Sponsor Codes.xlsx)">
                      MDM entry: <span style={{ color:"var(--text)" }}>
                        {a.client_name_raw}
                      </span>
                      {!a.client_country && (
                        <span style={{ marginLeft:6, fontSize:9,
                          padding:"1px 5px", borderRadius:4,
                          color:"var(--cyan)",
                          background:"rgba(0,207,255,0.10)",
                          border:"1px solid rgba(0,207,255,0.30)" }}>
                          global parent
                        </span>
                      )}
                    </div>
                  )}
                  {a.mdm && (
                    <div style={{ fontFamily:"var(--fm)", fontSize:10,
                      color:"var(--dim)", marginTop:3 }}>
                      MDM {a.mdm}
                      {a.matched_sponsor !== a.client_name && (
                        <> · CT.gov: {a.matched_sponsor}</>
                      )}
                    </div>
                  )}
                </div>
                <span style={{ fontFamily:"var(--fm)", fontSize:10,
                  fontWeight:600, padding:"3px 10px", borderRadius:10,
                  color:p.color, background:p.bg,
                  border:"1px solid "+p.border, letterSpacing:"0.08em",
                  whiteSpace:"nowrap" }}>
                  {a.alert_level} · {a.priority_score}
                </span>
              </div>

              {/* Stat bar */}
              <div style={{ display:"flex", gap:8, alignItems:"center",
                fontFamily:"var(--fm)", fontSize:11 }}>
                <span style={{ color:"var(--text)", fontWeight:600 }}>
                  {a.new_trial_count} new trials
                </span>
                <span style={{ color:"var(--muted)" }}>·</span>
                <span style={{ color:"var(--muted)" }}>
                  top phase {a.top_phase || "-"}
                </span>
              </div>

              {/* Modality pills */}
              <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                {(a.top_modalities || []).slice(0, 5).map(m => (
                  <ModPill key={m} m={m}/>
                ))}
              </div>

              {/* Alert reasons */}
              {a.alert_reasons && a.alert_reasons.length > 0 && (
                <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                  {a.alert_reasons.map((r, i) => (
                    <span key={i} style={{ fontFamily:"var(--fm)",
                      fontSize:10, padding:"2px 7px", borderRadius:10,
                      background:"#EF444418", color:"#F87171",
                      border:"1px solid #EF444430" }}>
                      🔥 {r}
                    </span>
                  ))}
                </div>
              )}

              {/* Expand/collapse trial list */}
              <button onClick={() => toggle(a.client_name)}
                style={{ marginTop:4, background:"transparent",
                  border:"1px solid var(--border2)", color:"var(--muted)",
                  borderRadius:4, padding:"5px 10px",
                  fontFamily:"var(--fm)", fontSize:10,
                  letterSpacing:"0.10em", cursor:"pointer",
                  display:"flex", alignItems:"center",
                  justifyContent:"center", gap:6 }}>
                <span style={{ transition:"transform 0.15s",
                  display:"inline-block",
                  transform: isOpen ? "rotate(180deg)" : "none" }}>▾</span>
                {isOpen ? "HIDE" : "VIEW"} TRIALS ({a.trials.length})
              </button>

              {isOpen && (
                <div style={{ marginTop:4, display:"flex",
                  flexDirection:"column", gap:4, maxHeight:260,
                  overflowY:"auto" }}>
                  {a.trials.map(t => (
                    <a key={t.nct_id} href={t.source_url} target="_blank"
                       rel="noreferrer"
                       style={{ display:"block", padding:"6px 10px",
                         background:"var(--surf3)", borderRadius:4,
                         textDecoration:"none", borderLeft:"2px solid "+p.color }}>
                      <div style={{ display:"flex", gap:6, alignItems:"center",
                        flexWrap:"wrap" }}>
                        <span style={{ fontFamily:"var(--fm)", fontSize:10,
                          color:"var(--cyan)" }}>{t.nct_id}</span>
                        {t.modality && <ModPill m={t.modality}/>}
                        {t.phase && (
                          <span style={{ fontFamily:"var(--fm)", fontSize:9,
                            color:"var(--muted)" }}>{t.phase}</span>
                        )}
                        {t.therapeutic_area && (
                          <span style={{ fontFamily:"var(--fm)", fontSize:9,
                            color:"var(--muted)" }}>
                            · {t.therapeutic_area}
                          </span>
                        )}
                      </div>
                      <div style={{ fontSize:11, color:"var(--text)",
                        marginTop:3, lineHeight:1.3 }}>
                        {t.title}
                      </div>
                    </a>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {alerts.length === 0 && (
        <div style={{ padding:"24px", textAlign:"center",
          fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>
          No clients match the current confidence filter.
        </div>
      )}
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────
// viz/mk_wq1.jsx
// Marketing / wq1 — Social-Ready Stat Cards
//
// Data source : ALEXIS_DATA.wq4  (list of 4 card objects)
// Injected by : analytics/mk_wq1.py → wq4_social_stat_cards()
//
// Each card: { id, title, value, sub, detail:[{label,value,pct?}], note }
// Designed to be screenshot-ready: large value, clean breakdown rows.
// ─────────────────────────────────────────────────────────────────────────

function WQ4StatCards({ data, color }) {
  if (!data?.length) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)",
      padding:"20px 0" }}>
      No summary data available. Verify snapshot was built with summary_v2.py.
    </div>
  );

  // Card 2 (Top TA) has a long string value — shrink font for it
  const valueFontSize = c => c.id === "mk_wq1_c2" ? 18 : 32;

  return (
    <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:14 }}>
      {data.map(card => (
        <div key={card.id}
          style={{ background:"var(--surf2)", borderRadius:10,
            border:`1px solid ${color.accent}22`,
            padding:"20px 22px", display:"flex", flexDirection:"column", gap:12 }}>

          {/* Card header */}
          <div>
            <div style={{ fontFamily:"var(--fm)", fontSize:9,
              color:color.mid, letterSpacing:"0.16em",
              textTransform:"uppercase", marginBottom:6 }}>
              {card.title}
            </div>
            <div style={{ fontFamily:"var(--fh)", fontSize:valueFontSize(card),
              fontWeight:700, color:"var(--text)", lineHeight:1.1,
              letterSpacing:"0.01em" }}>
              {card.value}
            </div>
            <div style={{ fontFamily:"var(--fm)", fontSize:11,
              color:"var(--muted)", marginTop:4 }}>
              {card.sub}
            </div>
          </div>

          {/* Detail rows with mini bar */}
          {card.detail?.length > 0 && (
            <div style={{ borderTop:`1px solid ${color.accent}18`,
              paddingTop:10, display:"flex", flexDirection:"column", gap:6 }}>
              {card.detail.map((row, i) => {
                const maxVal = Math.max(...card.detail.map(r => r.value));
                const barPct = maxVal > 0 ? (row.value / maxVal) * 100 : 0;
                return (
                  <div key={i}>
                    <div style={{ display:"flex", justifyContent:"space-between",
                      marginBottom:3 }}>
                      <span style={{ fontFamily:"var(--fm)", fontSize:11,
                        color:"var(--text)" }}>
                        {humanMod(row.label)}
                      </span>
                      <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                        <span style={{ fontFamily:"var(--fm)", fontSize:11,
                          fontWeight:600, color:"var(--text)" }}>
                          {fmt(row.value)}
                        </span>
                        {row.pct != null && (
                          <span style={{ fontFamily:"var(--fm)", fontSize:10,
                            color:"var(--muted)", minWidth:36, textAlign:"right" }}>
                            {row.pct}%
                          </span>
                        )}
                      </div>
                    </div>
                    {/* Mini bar */}
                    <div style={{ height:3, background:"var(--border)", borderRadius:2 }}>
                      <div style={{ width:`${barPct}%`, height:"100%",
                        background:color.accent, borderRadius:2, opacity:0.6 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Note */}
          <div style={{ fontFamily:"var(--fm)", fontSize:9,
            color:"var(--dim)", marginTop:"auto", letterSpacing:"0.06em" }}>
            {card.note}
          </div>
        </div>
      ))}
    </div>
  );
}


// -----------------------------------------------------------------------
// viz/mk_wq2.jsx
// Marketing / wq5 -- Modality & TA Over/Under Index
//
// Data source : ALEXIS_DATA.wq5  (from analytics/mk_wq2.py)
// Globals     : modColor, humanMod
// -----------------------------------------------------------------------

const WQ5_TREND_COLOR = {
  hot:     "#EF4444",
  rising:  "#F59E0B",
  steady:  "#64748B",
  cold:    "#3B82F6",
  new:     "#00CFFF",
};
const WQ5_TREND_LABEL = {
  hot: "HOT",     rising: "rising",  steady: "steady",
  cold: "cold",   new: "NEW",
};

function WQ5ModalityIndex({ data, color }) {
  if (!data || !data.available) {
    return (
      <div style={{ padding:"24px 16px", fontFamily:"var(--fm)",
        fontSize:12, color:"var(--muted)", textAlign:"center" }}>
        Over/Under index needs prior-week snapshots to compute a baseline.
        <div style={{ marginTop:6, fontSize:11, color:"var(--dim)" }}>
          Load at least one prior week when generating the dashboard.
        </div>
      </div>
    );
  }

  const [openKey, setOpenKey] = useState(null);

  const mods = data.modalities || [];
  const tas  = data.tas        || [];
  const th   = data.meta?.thresholds || {};

  // Shared scale for the diverging bars: clamp to [0, 3]
  const MAX_IDX = 3;

  // Diverging bar: center at 1.0, left=cold (width proportional to 1-idx),
  // right=hot (width proportional to idx-1)
  const DivergingBar = ({ row, side }) => {
    // side = "mod" or "ta" -- determines the key + color
    const idx     = row.index;
    const trend   = row.trend;
    const hueBar  = WQ5_TREND_COLOR[trend] || "#64748B";
    const hueLab  = side === "mod" ? modColor(row.name) : color.accent;

    const leftPct  = idx == null ? 0 : Math.min(1, Math.max(0, (1 - idx))) * 50;
    const rightPct = idx == null ? 0 : Math.min(1, Math.max(0, idx - 1) / (MAX_IDX - 1)) * 50;
    const zero     = idx == null;

    const key = `${side}:${row.name}`;
    const opened = openKey === key;

    return (
      <React.Fragment>
        <div onClick={() => setOpenKey(opened ? null : key)}
          style={{ display:"flex", alignItems:"center", gap:8,
            padding:"6px 10px", cursor:"pointer",
            background: opened ? "var(--surf3)" : "transparent",
            borderRadius:4, transition:"background 0.15s" }}>
          {/* Label */}
          <div style={{ width:160, flexShrink:0 }}>
            {side === "mod" ? (
              <span style={{ fontFamily:"var(--fm)", fontSize:11,
                padding:"2px 6px", borderRadius:8,
                background:modColor(row.name)+"20",
                color:modColor(row.name),
                border:"1px solid "+modColor(row.name)+"30" }}>
                {humanMod(row.name)}
              </span>
            ) : (
              <span style={{ fontFamily:"var(--fb)", fontSize:12,
                color:"var(--text)" }}>{row.name}</span>
            )}
          </div>
          {/* Diverging bar */}
          <div style={{ flex:1, position:"relative", height:16,
            background:"var(--surf2)", borderRadius:3, overflow:"hidden" }}>
            {/* Cold (left of center) */}
            <div style={{ position:"absolute", top:0, bottom:0,
              right:"50%", width:`${leftPct}%`,
              background:"rgba(59,130,246,0.85)",
              borderRadius:"3px 0 0 3px",
              transition:"width 0.3s ease" }}/>
            {/* Hot (right of center) */}
            <div style={{ position:"absolute", top:0, bottom:0,
              left:"50%", width:`${rightPct}%`,
              background:"rgba(239,68,68,0.85)",
              borderRadius:"0 3px 3px 0",
              transition:"width 0.3s ease" }}/>
            {/* Center line */}
            <div style={{ position:"absolute", top:0, bottom:0,
              left:"50%", width:2, background:"rgba(255,255,255,0.2)" }}/>
          </div>
          {/* Numeric */}
          <div style={{ width:50, textAlign:"right",
            fontFamily:"var(--fm)", fontSize:11,
            color: zero ? "var(--cyan)" : "var(--text)",
            fontWeight:600 }}>
            {zero ? "NEW" : `${idx}×`}
          </div>
          {/* This / baseline */}
          <div style={{ width:78, textAlign:"right",
            fontFamily:"var(--fm)", fontSize:10, color:"var(--muted)" }}>
            {row.this_week} / {row.baseline || "—"}
          </div>
          {/* Trend tag */}
          <div style={{ width:60, textAlign:"right" }}>
            <span style={{ fontFamily:"var(--fm)", fontSize:10,
              fontWeight: trend === "hot" || trend === "new" ? 600 : 500,
              color:hueBar, letterSpacing:"0.08em",
              textTransform:"uppercase" }}>
              {WQ5_TREND_LABEL[trend] || trend}
            </span>
          </div>
        </div>

        {opened && (row.samples || []).length > 0 && (
          <div style={{ padding:"4px 12px 10px 172px" }}>
            <div style={{ fontFamily:"var(--fm)", fontSize:9,
              letterSpacing:"0.12em", color:"var(--dim)",
              textTransform:"uppercase", marginBottom:4 }}>
              Story seeds
            </div>
            {row.samples.map((s, i) => (
              <a key={i} href={s.source_url} target="_blank" rel="noreferrer"
                 style={{ display:"block", padding:"5px 8px",
                   background:"var(--surf2)", borderRadius:4,
                   textDecoration:"none", marginBottom:3,
                   borderLeft:"2px solid "+hueBar }}>
                <span style={{ fontFamily:"var(--fm)", fontSize:10,
                  color:"var(--cyan)" }}>{s.nct_id}</span>
                <span style={{ marginLeft:6, color:"var(--text)",
                  fontSize:11 }}>{s.title}</span>
                {s.sponsor && (
                  <span style={{ marginLeft:6, color:"var(--muted)",
                    fontSize:10 }}>· {s.sponsor}</span>
                )}
              </a>
            ))}
          </div>
        )}
      </React.Fragment>
    );
  };

  const Panel = ({ title, rows, side }) => (
    <div style={{ flex:1, background:"var(--surf2)",
      borderRadius:8, border:"1px solid var(--border)",
      padding:"14px 16px" }}>
      <div style={{ fontFamily:"var(--fm)", fontSize:9,
        letterSpacing:"0.14em", color:color.mid,
        textTransform:"uppercase", marginBottom:10 }}>
        {title}
      </div>
      {/* Header row */}
      <div style={{ display:"flex", alignItems:"center", gap:8,
        padding:"4px 10px", fontFamily:"var(--fm)", fontSize:9,
        letterSpacing:"0.10em", color:"var(--dim)",
        textTransform:"uppercase", marginBottom:4 }}>
        <div style={{ width:160 }}>{side === "mod" ? "Modality" : "Therapeutic area"}</div>
        <div style={{ flex:1, position:"relative" }}>
          <span style={{ position:"absolute", left:0 }}>cold</span>
          <span style={{ position:"absolute", left:"50%",
            transform:"translateX(-50%)" }}>baseline 1×</span>
          <span style={{ position:"absolute", right:0 }}>hot</span>
        </div>
        <div style={{ width:50, textAlign:"right" }}>index</div>
        <div style={{ width:78, textAlign:"right" }}>this / base</div>
        <div style={{ width:60, textAlign:"right" }}>trend</div>
      </div>
      {rows.map(r => <DivergingBar key={r.name} row={r} side={side}/>)}
      {rows.length === 0 && (
        <div style={{ padding:"14px", textAlign:"center",
          color:"var(--muted)", fontSize:11 }}>
          no data in this bucket
        </div>
      )}
    </div>
  );

  return (
    <div style={{ padding:"0 12px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10,
        marginBottom:10, fontFamily:"var(--fm)", fontSize:10,
        color:"var(--muted)", letterSpacing:"0.06em" }}>
        <span><b style={{ color:"var(--text)" }}>{data.meta?.total_new || 0}</b> new drug trials this week</span>
        <span style={{ color:"var(--dim)" }}>|</span>
        <span>baseline from <b style={{ color:"var(--text)" }}>{data.meta?.prior_weeks_used || 0}</b> prior weeks</span>
        <span style={{ color:"var(--dim)" }}>|</span>
        <span>
          <b style={{ color:"#EF4444" }}>hot</b> {">="} {th.hot}x +
          {" "}{th.hot_min_count} trials ·
          {" "}<b style={{ color:"#3B82F6" }}>cold</b> {"<="} {th.cold}x with baseline {">="} {th.cold_min_base}
        </span>
      </div>

      <div style={{ display:"flex", gap:14 }}>
        <Panel title="Modalities" rows={mods} side="mod"/>
        <Panel title="Therapeutic areas" rows={tas} side="ta"/>
      </div>
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────
// viz/sci_wq1.jsx
// Scientific / wq1 — TA × Modality Bubble Matrix
//
// Data source : ALEXIS_DATA.wq7  (matrix dict)
// Injected by : analytics/sci_wq1.py → wq7_ta_modality_matrix()
// ─────────────────────────────────────────────────────────────────────────

const MODALITY_ABBR = {
  small_molecule:"SM", biologic:"Bio", monoclonal_antibody:"mAb",
  mab:"mAb", antibody_drug_conjugate:"ADC", adc:"ADC",
  gene_therapy:"GT", cell_therapy:"CT", cell_gene_therapy:"CGT",
  radiopharmaceutical:"Radio", oligonucleotide:"Oligo", peptide:"Pep",
  vaccine:"Vax", combination:"Combo", antibody_protein:"Ab/Pr",
  fusion_protein:"Fusion", other_drug:"Other",
};

function parseMasterDbLabel(filename) {
  if (!filename) return "master DB";
  const m = filename.match(/(\d{4})[_\s]?(Q\d)/i);
  if (m) return `${m[1]} ${m[2].toUpperCase()}`;
  const m2 = filename.match(/(\d{4})/);
  return m2 ? m2[1] : filename.replace(/\.json$/, "").replace(/master_DB_?/i, "");
}

function heatToColor(heat) {
  if (heat === null || heat === undefined) {
    return { bg:"var(--surf2)", border:"var(--border)", glow:"none" };
  }
  if (heat >= 0.15) {
    const t  = Math.min(heat, 1);
    const a1 = (0.12 + t * 0.40).toFixed(2);
    const a2 = (0.40 + t * 0.45).toFixed(2);
    return { bg:`rgba(239,68,68,${a1})`, border:`rgba(239,68,68,${a2})`,
             glow:`0 0 10px rgba(239,68,68,${(t*0.5).toFixed(2)})` };
  }
  if (heat <= -0.15) {
    const t  = Math.min(Math.abs(heat), 1);
    const a1 = (0.08 + t * 0.22).toFixed(2);
    const a2 = (0.25 + t * 0.35).toFixed(2);
    return { bg:`rgba(59,130,246,${a1})`, border:`rgba(59,130,246,${a2})`,
             glow:`0 0 8px rgba(59,130,246,${(t*0.4).toFixed(2)})` };
  }
  return { bg:"rgba(200,216,238,0.07)", border:"rgba(200,216,238,0.18)", glow:"none" };
}

const PHASE_ORDER = {
  "PHASE3":1, "PHASE2/PHASE3":2, "PHASE2":3, "PHASE1/PHASE2":4,
  "PHASE1":5, "EARLY_PHASE1":6, "PHASE4":7, "NA":8, "—":9,
};
function phaseSort(a, b) {
  return (PHASE_ORDER[a.phase] || 99) - (PHASE_ORDER[b.phase] || 99);
}

const PHASE_COLORS = {
  "PHASE3":"#22C55E", "PHASE2/PHASE3":"#86EFAC", "PHASE2":"#38BDF8",
  "PHASE1/PHASE2":"#7DD3FC", "PHASE1":"#A78BFA", "EARLY_PHASE1":"#C4B5FD",
  "PHASE4":"#FB923C", "NA":"#6B7280", "—":"#4B5563",
};

function WQ7BubbleMatrix({ data, color }) {
  const [openCell, setOpenCell] = useState(null);
  const [tooltip,  setTooltip]  = useState(null);

  if (!data?.available) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)", padding:"20px 0" }}>
      No data — enriched file not loaded or no new drug registrations this window.
    </div>
  );

  const { rows, columns, cells, row_totals, col_totals, grand_total,
          has_heat, heat_mode, prior_weeks_used, prior_window_labels,
          week_total, db_total } = data;

  const masterLabel = parseMasterDbLabel(ALEXIS_DATA?.master_db_meta?.filename);
  const maxCount    = Math.max(...Object.values(cells).map(c => c.count), 1);
  const bubbleSize  = n => n === 0 ? 0 : Math.max(8, Math.sqrt(n / maxCount) * 40);

  const COL_W   = 66;
  const ROW_H   = 52;
  const LABEL_W = 194;

  const heatBadge = heat_mode === "rolling_avg"
    ? `✓ heat vs ${prior_weeks_used}-week rolling avg`
    : heat_mode === "master_db"
    ? `✓ heat vs ${masterLabel} baseline`
    : null;

  return (
    <div>
      {/* Summary strip */}
      <div style={{ display:"flex", gap:14, marginBottom:16,
        alignItems:"center", flexWrap:"wrap" }}>
        <div style={{ fontFamily:"var(--fm)", fontSize:12 }}>
          <span style={{ color:color.mid, fontWeight:600 }}>{fmt(grand_total)}</span>
          <span style={{ color:"var(--muted)" }}> new drug registrations this window</span>
        </div>
        <div style={{ fontFamily:"var(--fm)", fontSize:10,
          color:"var(--dim)", letterSpacing:"0.06em" }}>
          Click each bubble for more details
        </div>
        {heatBadge && (
          <div style={{ fontFamily:"var(--fm)", fontSize:10,
            color:"var(--green)", background:"rgba(34,197,94,0.08)",
            border:"1px solid rgba(34,197,94,0.3)", borderRadius:4, padding:"3px 8px" }}>
            {heatBadge}
          </div>
        )}
        {has_heat && (
          <div style={{ display:"flex", alignItems:"center", gap:8, marginLeft:"auto" }}>
            <span style={{ fontFamily:"var(--fm)", fontSize:9,
              color:"var(--dim)", letterSpacing:"0.1em" }}>HEAT</span>
            {[
              { label:"cooler",   bg:"rgba(59,130,246,0.22)",  border:"rgba(59,130,246,0.5)" },
              { label:"baseline", bg:"rgba(200,216,238,0.07)", border:"rgba(200,216,238,0.18)" },
              { label:"hotter",   bg:"rgba(239,68,68,0.38)",   border:"rgba(239,68,68,0.7)" },
            ].map(s => (
              <div key={s.label} style={{ display:"flex", alignItems:"center", gap:4 }}>
                <div style={{ width:12, height:12, borderRadius:3,
                  background:s.bg, border:`1px solid ${s.border}` }} />
                <span style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--muted)" }}>
                  {s.label}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Prior week labels */}
      {prior_window_labels?.length > 0 && (
        <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
          <span style={{ fontFamily:"var(--fm)", fontSize:9,
            color:"var(--dim)", letterSpacing:"0.1em", alignSelf:"center" }}>
            AVG OVER:
          </span>
          {prior_window_labels.map((lbl, i) => (
            <span key={i} style={{ fontFamily:"var(--fm)", fontSize:9,
              color:"var(--muted)", background:"var(--surf2)",
              border:"1px solid var(--border)", borderRadius:4, padding:"2px 7px" }}>
              {lbl}
            </span>
          ))}
        </div>
      )}

      {/* Matrix */}
      <div style={{ overflowX:"auto" }}>
        <div style={{ display:"inline-block",
          minWidth: LABEL_W + columns.length * COL_W + 56 }}>

          {/* Column headers */}
          <div style={{ display:"flex", marginLeft:LABEL_W }}>
            {columns.map(mod => (
              <div key={mod} style={{ width:COL_W, flexShrink:0,
                textAlign:"center", paddingBottom:8 }}>
                <div style={{ fontFamily:"var(--fm)", fontSize:10,
                  color:modColor(mod), letterSpacing:"0.06em", fontWeight:600 }}>
                  {MODALITY_ABBR[mod] || mod.slice(0,6)}
                </div>
                <div style={{ fontFamily:"var(--fm)", fontSize:9,
                  color:"var(--muted)", marginTop:1 }}>
                  {fmt(col_totals[mod])}
                </div>
              </div>
            ))}
            <div style={{ width:56, flexShrink:0, textAlign:"right",
              fontFamily:"var(--fm)", fontSize:9, color:"var(--dim)",
              paddingBottom:8, paddingRight:4, alignSelf:"flex-end" }}>
              TOTAL
            </div>
          </div>

          {/* Rows + inline expanded panel */}
          {rows.map((ta, ri) => (
            <div key={ta}>
              <div style={{ display:"flex", alignItems:"center",
                borderTop:"1px solid var(--border)",
                background: ri % 2 === 0 ? "transparent" : "rgba(255,255,255,0.015)" }}>

                <div title={ta} style={{ width:LABEL_W, flexShrink:0,
                  padding:"0 10px 0 0", fontFamily:"var(--fb)", fontSize:11,
                  color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis",
                  whiteSpace:"nowrap", height:ROW_H,
                  display:"flex", alignItems:"center" }}>
                  {ta}
                </div>

                {columns.map(mod => {
                  const key  = `${ta}||${mod}`;
                  const cell = cells[key] || { count:0, heat:null, trials:[] };
                  const sz   = bubbleSize(cell.count);
                  const hc   = heatToColor(cell.heat);
                  const isActive = openCell === key;
                  return (
                    <div key={mod}
                      style={{ width:COL_W, height:ROW_H, flexShrink:0,
                        display:"flex", alignItems:"center", justifyContent:"center",
                        cursor: cell.count > 0 ? "pointer" : "default" }}
                      onClick={() => {
                        if (cell.count > 0) {
                          setOpenCell(prev => prev === key ? null : key);
                          setTooltip(prev =>
                            (prev?.key === key) ? null : { cell, ta, mod, key }
                          );
                        }
                      }}>
                      {cell.count > 0 && (
                        <div style={{
                          width:sz, height:sz, borderRadius:"50%",
                          background:hc.bg, border:`1.5px solid ${hc.border}`,
                          display:"flex", alignItems:"center", justifyContent:"center",
                          transition:"all 0.15s",
                          transform: isActive ? "scale(1.2)" : "scale(1)",
                          boxShadow: isActive ? hc.glow : "none",
                          outline: isActive ? `2px solid ${hc.border}` : "none",
                          outlineOffset: 3,
                        }}>
                          {sz >= 22 && (
                            <span style={{ fontFamily:"var(--fm)",
                              fontSize: sz >= 30 ? 11 : 9, fontWeight:600,
                              color:"var(--text)", userSelect:"none" }}>
                              {cell.count}
                            </span>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}

                <div style={{ width:56, flexShrink:0, textAlign:"right",
                  paddingRight:4, fontFamily:"var(--fm)", fontSize:11,
                  fontWeight:600, color:color.mid }}>
                  {fmt(row_totals[ta])}
                </div>
              </div>

              {/* Inline expanded panel */}
              {columns.some(mod => openCell === `${ta}||${mod}`) && (() => {
                const activeKey  = columns.map(m => `${ta}||${m}`).find(k => openCell === k);
                const activeCell = cells[activeKey] || {};
                const activeMod  = activeKey ? activeKey.split("||")[1] : "";
                const sorted     = [...(activeCell.trials || [])].sort(phaseSort);
                return (
                  <div style={{ borderTop:"1px solid var(--border2)",
                    background:"var(--surf2)", padding:"12px 16px 16px",
                    marginLeft: LABEL_W }}>

                    <div style={{ display:"flex", alignItems:"center",
                      gap:10, marginBottom:10, flexWrap:"wrap" }}>
                      <div style={{ width:10, height:10, borderRadius:"50%",
                        background:modColor(activeMod), flexShrink:0 }} />
                      <span style={{ fontFamily:"var(--fb)", fontSize:12,
                        color:"var(--text)" }}>
                        {ta} — {humanMod(activeMod)}
                      </span>
                      <span style={{ fontFamily:"var(--fm)", fontSize:11,
                        color:color.mid }}>
                        {activeCell.count} trial{activeCell.count !== 1 ? "s" : ""} this week
                      </span>
                      {activeCell.prior_avg_count != null && (
                        <span style={{ fontFamily:"var(--fm)", fontSize:10,
                          color:"var(--muted)" }}>
                          · {prior_weeks_used}-week avg: {activeCell.prior_avg_count.toFixed(1)}

                      )}
                      {activeCell.baseline_n != null && (
                        <span style={{ fontFamily:"var(--fm)", fontSize:10,
                          color:"var(--dim)" }}>
                          · {masterLabel} total: {fmt(activeCell.baseline_n)}
                        </span>
                      )}
                      {activeCell.heat_label && (
                        <span style={{ fontFamily:"var(--fm)", fontSize:10, fontWeight:600,
                          color: activeCell.heat >= 0.15 ? "#EF4444"
                               : activeCell.heat <= -0.15 ? "#60A5FA"
                               : "var(--muted)" }}>
                          {activeCell.heat_label}
                        </span>
                      )}
                      <button onClick={() => setOpenCell(null)}
                        style={{ marginLeft:"auto", fontFamily:"var(--fm)",
                          fontSize:10, color:"var(--muted)", background:"transparent",
                          border:"none", cursor:"pointer", padding:"2px 6px" }}>
                        ✕ close
                      </button>
                    </div>

                    <div style={{ maxHeight:260, overflowY:"auto",
                      border:"1px solid var(--border)", borderRadius:6 }}>
                      <table style={{ width:"100%", borderCollapse:"collapse" }}>
                        <thead style={{ position:"sticky", top:0,
                          background:"var(--surf3)", zIndex:1 }}>
                          <tr>
                            {["NCT ID","TITLE","PHASE"].map(h => (
                              <th key={h} style={{ padding:"6px 10px",
                                fontFamily:"var(--fm)", fontSize:9,
                                color:"var(--dim)", letterSpacing:"0.12em",
                                textAlign:"left", fontWeight:500,
                                borderBottom:"1px solid var(--border)" }}>
                                {h}
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {sorted.map((t, ti) => {
                            const pc = PHASE_COLORS[t.phase] || "#6B7280";
                            return (
                              <tr key={t.nct_id || ti}
                                style={{ borderTop: ti > 0 ? "1px solid var(--border)" : "none",
                                  background: ti % 2 === 0 ? "transparent" : "rgba(255,255,255,0.01)" }}>
                                <td style={{ padding:"5px 10px", whiteSpace:"nowrap" }}>
                                  <a href={`https://clinicaltrials.gov/expert-search?term=${t.nct_id}`}
                                     target="_blank" rel="noopener noreferrer"
                                     style={{ fontFamily:"var(--fm)", fontSize:11,
                                       color:"var(--cyan)", textDecoration:"none" }}
                                     onMouseOver={e => e.target.style.textDecoration="underline"}
                                     onMouseOut={e  => e.target.style.textDecoration="none"}>
                                    {t.nct_id}
                                  </a>
                                </td>
                                <td style={{ padding:"5px 10px", fontSize:11,
                                  color:"var(--text)", maxWidth:480,
                                  overflowX:"auto", whiteSpace:"nowrap" }}>
                                  {t.title}
                                </td>
                                <td style={{ padding:"5px 10px", whiteSpace:"nowrap" }}>
                                  <span style={{ fontFamily:"var(--fm)", fontSize:10,
                                    padding:"2px 7px", borderRadius:8,
                                    background:(PHASE_COLORS[t.phase]||"#6B7280")+"18",
                                    color:pc, border:`1px solid ${pc}30` }}>
                                    {t.phase}
                                  </span>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}
            </div>
          ))}

          {/* Column totals footer */}
          <div style={{ display:"flex", borderTop:"1px solid var(--border2)", marginTop:2 }}>
            <div style={{ width:LABEL_W, flexShrink:0, fontFamily:"var(--fm)",
              fontSize:9, color:"var(--dim)", padding:"6px 10px 0 0",
              textAlign:"right", letterSpacing:"0.1em" }}>
              TOTAL
            </div>
            {columns.map(mod => (
              <div key={mod} style={{ width:COL_W, flexShrink:0, textAlign:"center",
                fontFamily:"var(--fm)", fontSize:11, fontWeight:600,
                color:modColor(mod), paddingTop:6 }}>
                {fmt(col_totals[mod])}
              </div>
            ))}
            <div style={{ width:56, flexShrink:0, textAlign:"right",
              paddingRight:4, fontFamily:"var(--fm)", fontSize:12,
              fontWeight:700, color:"var(--cyan)", paddingTop:6 }}>
              {fmt(grand_total)}
            </div>
          </div>
        </div>
      </div>

      {/* Modality key */}
      <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginTop:14 }}>
        {columns.map(mod => (
          <div key={mod} style={{ display:"flex", alignItems:"center", gap:5 }}>
            <div style={{ width:8, height:8, borderRadius:"50%", background:modColor(mod) }} />
            <span style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--muted)" }}>
              {MODALITY_ABBR[mod] || mod} = {humanMod(mod)}
            </span>
          </div>
        ))}
      </div>

      {/* Click-triggered sidebar panel */}
      {tooltip && (
        <div style={{ marginTop:14, borderRadius:10,
          background:"var(--surf2)", border:`1px solid ${heatToColor(tooltip.cell.heat).border}`,
          padding:"14px 16px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
            <div style={{ width:9, height:9, borderRadius:"50%",
              background:modColor(tooltip.mod), flexShrink:0 }} />
            <span style={{ fontFamily:"var(--fb)", fontSize:12, color:"var(--text)" }}>
              {humanMod(tooltip.mod)}
            </span>
            <span style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)" }}>·</span>
            <span style={{ fontFamily:"var(--fm)", fontSize:11,
              color:"var(--muted)", overflow:"hidden", textOverflow:"ellipsis",
              whiteSpace:"nowrap" }}>
              {tooltip.ta}
            </span>
            <button onClick={() => { setTooltip(null); setOpenCell(null); }}
              style={{ marginLeft:"auto", fontFamily:"var(--fm)", fontSize:10,
                color:"var(--muted)", background:"transparent",
                border:"none", cursor:"pointer", padding:"2px 6px", flexShrink:0 }}>
              ✕
            </button>
          </div>
          <div style={{ display:"flex", gap:20, flexWrap:"wrap", marginBottom:10 }}>
            <div>
              <div style={{ fontFamily:"var(--fm)", fontSize:9,
                color:"var(--dim)", letterSpacing:"0.1em", marginBottom:2 }}>
                THIS WEEK

              <div style={{ fontFamily:"var(--fm)", fontSize:22,
                fontWeight:700, color:"var(--cyan)", lineHeight:1 }}>
                {tooltip.cell.count}

              <div style={{ fontFamily:"var(--fm)", fontSize:9, color:"var(--muted)" }}>
                new trials

            {tooltip.cell.prior_avg_count != null && (

                <div style={{ fontFamily:"var(--fm)", fontSize:9,
                  color:"var(--dim)", letterSpacing:"0.1em", marginBottom:2 }}>
                  {prior_weeks_used}-WK AVG

                <div style={{ fontFamily:"var(--fm)", fontSize:22,
                  fontWeight:700, color:"var(--muted)", lineHeight:1 }}>

          {tooltip.cell.heat_label && (

              marginBottom:10,
              color: tooltip.cell.heat >= 0.15 ? "#EF4444"
                   : tooltip.cell.heat <= -0.15 ? "#60A5FA"
                   : "var(--muted)" }}>
              {tooltip.cell.heat_label}
            </div>
          )}
          {/* Trial list — only when bubble is also selected */}
          {openCell === tooltip.key && (() => {

                border:"1px solid var(--border)", borderRadius:6 }}>

                    {sorted.map((t, ti) => {
                      const pc = PHASE_COLORS[t.phase] || "#6B7280";
                      return (
                        <tr key={t.nct_id || ti}
                          style={{ borderTop: ti > 0 ? "1px solid var(--border)" : "none",
                            background: ti%2===0 ? "transparent" : "rgba(255,255,255,0.01)" }}>
                          <td style={{ padding:"4px 8px", whiteSpace:"nowrap" }}>
                            <a href={`https://clinicaltrials.gov/expert-search?term=${t.nct_id}`}
                               target="_blank" rel="noopener noreferrer"
                               style={{ fontFamily:"var(--fm)", fontSize:10,
                                 color:"var(--cyan)", textDecoration:"none" }}
                               onMouseOver={e => e.target.style.textDecoration="underline"}
                               onMouseOut={e  => e.target.style.textDecoration="none"}>
                              {t.nct_id}
                            </a>
                          </td>
                          <td style={{ padding:"4px 8px", fontSize:10,
                            color:"var(--text)", maxWidth:380,
                            overflowX:"auto", whiteSpace:"nowrap" }}>
                            {t.title}
                          </td>
                          <td style={{ padding:"4px 8px", whiteSpace:"nowrap" }}>
                            <span style={{ fontFamily:"var(--fm)", fontSize:9,
                              padding:"2px 6px", borderRadius:6,
                              background:pc+"18", color:pc,
                              border:`1px solid ${pc}30` }}>
                              {t.phase}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          })()}
          {openCell !== tooltip.key && tooltip.cell.count > 0 && (
            <div style={{ fontFamily:"var(--fm)", fontSize:9,
              color:"var(--dim)", marginTop:4 }}>
              click the bubble again to show trials ↑
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Scientific / wq8 -- Status-Change Spotlight (why_stopped focus)
//
// Data source : ALEXIS_DATA.wq8  (from analytics/sci_wq2.py)
// Globals     : modColor, humanMod
// -----------------------------------------------------------------------

const WQ8_BUCKET_COLORS = {
  safety:     "#EF4444",   // red
  efficacy:   "#F97316",   // orange
  enrollment: "#3B82F6",   // blue
  funding:    "#A78BFA",   // purple
  business:   "#64748B",   // slate
  regulatory: "#F59E0B",   // amber
  covid:      "#06B6D4",   // cyan
  logistics:  "#14B8A6",   // teal
  other:      "#4B5563",   // grey
  unstated:   "#374151",   // dark grey
};

const WQ8_BUCKET_LABEL = {
  safety: "Safety", efficacy: "Efficacy / futility",
  enrollment: "Enrollment issues", funding: "Funding",
  business: "Business / strategic", regulatory: "Regulatory",
  covid: "COVID-related", logistics: "Logistics / supply",
  other: "Other (specified)", unstated: "Not stated",
};

const WQ8_PHASE_COLORS = {
  "PHASE3":"#22C55E","PHASE2/PHASE3":"#86EFAC",
  "PHASE2":"#38BDF8","PHASE1/PHASE2":"#7DD3FC",
  "PHASE1":"#A78BFA","EARLY_PHASE1":"#C4B5FD",
  "PHASE4":"#FB923C","NA":"#6B7280","-":"#4B5563",
};

function WQ8StatusSpotlight({ data, color }) {
  if (!data || !data.available) {
    return (
      <div style={{ padding:"28px 16px", fontFamily:"var(--fm)",
        fontSize:12, color:"var(--muted)", textAlign:"center" }}>
        No status changes detected in this window.
        <div style={{ marginTop:6, fontSize:11, color:"var(--dim)" }}>
          Run analytics/run_update_categorizer.py to generate the enriched file.
        </div>
      </div>
    );
  }

  const [bucketFilter, setBucketFilter] = useState(null);
  const [expandedNct, setExpandedNct]   = useState(null);

  const buckets = data.why_stopped_buckets || {};
  const events  = data.why_stopped_events  || [];
  const newly   = data.newly_recruiting    || [];
  const cats    = data.category_counts     || {};
  const transitions = data.status_transitions || [];

  const totalStops = Object.values(buckets).reduce((a, b) => a + b, 0);

  // ── SVG donut for why_stopped buckets ────────────────────────────────
  const Donut = ({ size = 190, stroke = 32 }) => {
    const entries = Object.entries(buckets);
    if (totalStops === 0 || entries.length === 0) {
      return (
        <div style={{ width:size, height:size, display:"flex",
          alignItems:"center", justifyContent:"center",
          color:"var(--muted)", fontFamily:"var(--fm)", fontSize:11 }}>
          no stop events
        </div>
      );
    }
    const r = (size - stroke) / 2;
    const C = 2 * Math.PI * r;
    let offset = 0;
    const arcs = entries.map(([bucket, count]) => {
      const pct  = count / totalStops;
      const dash = pct * C;
      const arc = {
        bucket, count,
        color: WQ8_BUCKET_COLORS[bucket] || "#475569",
        dash, dashArray: `${dash} ${C - dash}`,
        dashOffset: -offset,
        active: bucketFilter === bucket,
      };
      offset += dash;
      return arc;
    });
    return (
      <svg width={size} height={size} style={{ display:"block" }}>
        <defs>
          <filter id="wq8-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>
        <circle cx={size/2} cy={size/2} r={r} fill="none"
          stroke="var(--border)" strokeWidth={stroke} opacity={0.3}/>
        {arcs.map((a, i) => (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
            stroke={a.color} strokeWidth={stroke}
            strokeDasharray={a.dashArray}
            strokeDashoffset={a.dashOffset}
            transform={`rotate(-90 ${size/2} ${size/2})`}
            onClick={() => setBucketFilter(a.active ? null : a.bucket)}
            style={{ cursor:"pointer", opacity: bucketFilter && !a.active ? 0.25 : 1,
              transition:"opacity 0.2s, stroke-width 0.2s",
              filter: a.active ? "url(#wq8-glow)" : "none" }}/>
        ))}
        <text x={size/2} y={size/2 - 6} textAnchor="middle"
          style={{ fontFamily:"var(--fh)", fontSize:30, fontWeight:700,
            fill:"var(--text)" }}>
          {totalStops}
        </text>
        <text x={size/2} y={size/2 + 14} textAnchor="middle"
          style={{ fontFamily:"var(--fm)", fontSize:9, letterSpacing:"0.14em",
            fill:"var(--muted)" }}>
          STOPPED
        </text>
      </svg>
    );
  };

  // ── Visible event rows (with bucket filter) ──────────────────────────
  const visibleEvents = bucketFilter
    ? events.filter(e => e.bucket === bucketFilter)
    : events;

  return (
    <div style={{ padding:"2px 12px" }}>
      {/* Header KPIs */}
      <div style={{ display:"flex", gap:10, marginBottom:14 }}>
        {[
          { label:"EXISTING-TRIAL CHANGES",  value:data.total_existing_changes },
          { label:"STATUS TRANSITIONS",      value:data.total_status_changes },
          { label:"TRIALS STOPPED / COMPLETED", value:events.length },
          { label:"NEWLY ACTIVE",            value:newly.length,
            tone:"#22C55E" },
        ].map((k, i) => (
          <div key={i} style={{ flex:1,
            background:"var(--surf2)", borderRadius:8,
            border:`1px solid ${color.accent}22`, padding:"12px 14px" }}>

              color:"var(--muted)", letterSpacing:"0.14em" }}>

            <div style={{ fontFamily:"var(--fh)", fontSize:24, fontWeight:700,
              color: k.tone || "var(--text)", marginTop:2 }}>
              {k.value.toLocaleString()}
            </div>
          </div>
        ))}
      </div>

      {/* ── Category summary (horizontal bars) ──────────────────────── */}
      <div style={{ marginBottom:18, padding:"12px 14px",
        background:"var(--surf2)", borderRadius:8,
        border:"1px solid var(--border)" }}>
        <div style={{ fontFamily:"var(--fm)", fontSize:9,
          letterSpacing:"0.14em", color:color.mid,
          textTransform:"uppercase", marginBottom:10 }}>
          Updates by category

        {(() => {
          const entries = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,8);
          if (!entries.length) return <div style={{ color:"var(--muted)",
            fontSize:11 }}>no categories</div>;
          const max = Math.max(...entries.map(e=>e[1]));
          return entries.map(([cat, n]) => {
            const pct = (n / max) * 100;
            const isStatus = cat.startsWith("status_");
            const tone = isStatus ? "#EF4444" : color.accent;
            return (
              <div key={cat} style={{ display:"flex",
                alignItems:"center", gap:10, padding:"4px 0" }}>
                <div style={{ width:200, fontFamily:"var(--fm)", fontSize:11,
                  color:"var(--text)" }}>
                  {cat}
                </div>
                <div style={{ flex:1, height:6, background:"var(--border)",
                  borderRadius:3 }}>
                  <div style={{ width:`${pct}%`, height:"100%",
                    background:tone, borderRadius:3,
                    transition:"width 0.3s ease", opacity:0.8 }}/>
                </div>
                <div style={{ fontFamily:"var(--fm)", fontSize:12,
                  color:"var(--text)", minWidth:40, textAlign:"right" }}>
                  {n}
                </div>
              </div>
            );
          });
        })()}
      </div>

      {/* Why-stopped spotlight header */}
      <div style={{ marginBottom:18, padding:"14px 16px",
        background:"var(--surf2)", borderRadius:8,
        border:"1px solid var(--border)" }}>
        <div style={{ display:"flex", alignItems:"center",
          justifyContent:"space-between", marginBottom:12 }}>
          <div style={{ fontFamily:"var(--fm)", fontSize:9,
            letterSpacing:"0.14em", color:color.mid,
            textTransform:"uppercase" }}>
            Why did trials stop? (click a slice or chip to filter)
          </div>
          {bucketFilter && (
            <button onClick={() => setBucketFilter(null)}
              style={{ background:"transparent", border:"1px solid var(--border2)",

          <div style={{ flexShrink:0 }}><Donut/></div>

          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6,

              {Object.entries(buckets).map(([b, n]) => {
                const hue = WQ8_BUCKET_COLORS[b] || "#475569";

                <thead>

      {newly.length > 0 && (
        <div style={{ marginBottom:4, padding:"14px 16px",
          background:"var(--surf2)", borderRadius:8,
          border:"1px solid var(--border)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10,

            <div style={{ fontFamily:"var(--fm)", fontSize:9,

              textTransform:"uppercase" }}>
              Newly active ({newly.length})
            </div>
            <div style={{ fontFamily:"var(--fm)", fontSize:10,
              color:"var(--muted)" }}>
              Trials that flipped into RECRUITING / ACTIVE this week
            </div>
          </div>
          <div style={{ display:"flex", gap:10, overflowX:"auto",
            paddingBottom:4 }}>
            {newly.slice(0, 24).map((t, i) => {
              const phase = t.phase || "-";
              const pc = WQ8_PHASE_COLORS[phase] || "#4B5563";
              return (
                <a key={i} href={t.source_url} target="_blank" rel="noreferrer"

                      color:"var(--cyan)" }}>{t.nct_id}</span>

                    {t.modality && (
                      <span style={{ fontFamily:"var(--fm)", fontSize:9,

                    display:"-webkit-box", WebkitLineClamp:2,
                    WebkitBoxOrient:"vertical", overflow:"hidden" }}>
                    {t.title}
                  </div>
                  <div style={{ fontFamily:"var(--fm)", fontSize:10,
                    color:"var(--muted)", marginTop:4 }}>
                    {t.sponsor || "-"}
                  </div>
                </a>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────
// viz/ops_wq1.jsx
// Operations / wq1 — Velocity Dashboard (4 tiles)
//
// Data source : ALEXIS_DATA.wq10
// Injected by : analytics/ops_wq1.py → wq10_velocity_dashboard()
// ─────────────────────────────────────────────────────────────────────────

// ── Shared mini-sparkline SVG ─────────────────────────────────────────────
function MiniSparkline({ points, accentColor, width=220, height=64, showArea=true, fluid=false }) {
  if (!points || points.length < 2) return null;
  const vals  = points.map(p => p.drug_new ?? p.pct ?? 0);
  const maxV  = Math.max(...vals, 1);
  const minV  = Math.min(...vals, 0);
  const range = maxV - minV || 1;
  const pad   = { l:6, r:6, t:8, b:20 };
  const W = width  - pad.l - pad.r;
  const H = height - pad.t - pad.b;
  const x = i => pad.l + (i / (points.length - 1)) * W;
  const y = v => pad.t + H - ((v - minV) / range) * H;

  const ptCoords = points.map((p, i) => [x(i), y(p.drug_new ?? p.pct ?? 0)]);
  const lineD    = ptCoords.map(([px,py], i) => `${i===0?'M':'L'}${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
  const areaD    = lineD
    + ` L${ptCoords[ptCoords.length-1][0].toFixed(1)},${(pad.t+H).toFixed(1)}`
    + ` L${ptCoords[0][0].toFixed(1)},${(pad.t+H).toFixed(1)} Z`;

  const gradId = `sg-${accentColor.replace(/[^a-z0-9]/gi,'')}`;

  const svgProps = fluid
    ? { viewBox:`0 0 ${width} ${height}`, preserveAspectRatio:"none",
        style:{ overflow:"visible", display:"block", width:"100%", height:"100%" } }
    : { width, height, style:{ overflow:"visible", display:"block" } };

  return (
    <svg {...svgProps}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor={accentColor} stopOpacity="0.25" />
          <stop offset="100%" stopColor={accentColor} stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {showArea && <path d={areaD} fill={`url(#${gradId})`} />}
      <path d={lineD} fill="none" stroke={accentColor} strokeWidth="1.8"
            strokeLinejoin="round" strokeLinecap="round" />
      {ptCoords.map(([px,py], i) => {
        const isCur = points[i].is_current;
        return (
          <g key={i}>
            <circle cx={px} cy={py} r={isCur ? 5 : 3}
              fill={isCur ? accentColor : "var(--bg)"}
              stroke={accentColor} strokeWidth={isCur ? 0 : 1.5} />
            {isCur && <circle cx={px} cy={py} r={8} fill={accentColor} opacity="0.18" />}
          </g>
        );
      })}
      {/* x-axis labels */}
      {points.map((p, i) => (
        <text key={i} x={x(i)} y={pad.t + H + 14}
          textAnchor="middle" fontSize="8"
          fill={p.is_current ? accentColor : "var(--dim)"}
          fontFamily="var(--fm)"
          fontWeight={p.is_current ? "600" : "400"}>
          {p.short_label}
        </text>
      ))}
    </svg>
  );
}

// ── Diverging bar chart ────────────────────────────────────────────────────
function DivergingBars({ bars, accentColor, labelFn }) {
  if (!bars || bars.length === 0) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:11, color:"var(--muted)",
      padding:"12px 0" }}>No prior week data available.</div>
  );

  const gainers   = bars.filter(b => b.delta_pct >= 0)
                        .sort((a,b) => b.delta_pct - a.delta_pct)
                        .slice(0, 3);
  const decliners = bars.filter(b => b.delta_pct < 0)
                        .sort((a,b) => a.delta_pct - b.delta_pct)
                        .slice(0, 3);
  if (gainers.length + decliners.length === 0) return null;

  const maxAbs = Math.max(
    ...gainers.map(b => b.delta_pct),
    ...decliners.map(b => Math.abs(b.delta_pct)),
    1
  );

  const LABEL_W = 110;

  const Row = ({ b }) => {
    const isGain = b.delta_pct >= 0;
    const pct    = Math.abs(b.delta_pct) / maxAbs * 100;
    const barCol = isGain ? (accentColor || "#F59E0B") : "rgba(59,130,246,0.8)";
    const valCol = isGain ? "#F87171" : "#60A5FA";
    return (
      <div style={{ display:"flex", alignItems:"center", gap:0, height:24 }}>
        {/* Label */}
        <div title={b.label}
          style={{ width:LABEL_W, flexShrink:0, fontFamily:"var(--fb)", fontSize:10,
            color:"var(--text)", overflowX:"auto", overflowY:"hidden",
            whiteSpace:"nowrap", textAlign:"right", paddingRight:8 }}>
          {labelFn ? labelFn(b.label) : b.label}
        </div>

        {/* Left half-track — decliners grow leftward */}
        <div style={{ flex:1, display:"flex", justifyContent:"flex-end",
          alignItems:"center", position:"relative", height:"100%" }}>
          {!isGain && (
            <div style={{ width:`${pct}%`, height:10,
              background:barCol, borderRadius:"3px 0 0 3px",
              transition:"width 0.3s ease" }} />
          )}
        </div>

        {/* Zero line */}
        <div style={{ width:2, flexShrink:0, alignSelf:"stretch",
          background:"rgba(255,255,255,0.15)" }} />

        {/* Right half-track — gainers grow rightward */}
        <div style={{ flex:1, display:"flex", justifyContent:"flex-start",
          alignItems:"center", position:"relative", height:"100%" }}>
          {isGain && (
            <div style={{ width:`${pct}%`, height:10,
              background:barCol, borderRadius:"0 3px 3px 0",
              transition:"width 0.3s ease" }} />
          )}
        </div>

        {/* Value + count */}
        <div style={{ width:58, flexShrink:0, textAlign:"right",
          fontFamily:"var(--fm)", fontSize:10, fontWeight:600, color:valCol }}>
          {isGain ? "+" : ""}{b.delta_pct.toFixed(1)}%
        </div>
        <div style={{ width:32, flexShrink:0, fontFamily:"var(--fm)",
          fontSize:9, color:"var(--dim)", textAlign:"right" }}>
          n={b.current_n}
        </div>
      </div>
    );
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
      {gainers.map(b => <Row key={b.label} b={b} />)}
      {gainers.length > 0 && decliners.length > 0 && (
        <div style={{ height:1, background:"var(--border2)",
          margin:"4px 0", opacity:0.4 }} />
      )}
      {decliners.map(b => <Row key={b.label} b={b} />)}
      <div style={{ fontFamily:"var(--fm)", fontSize:8, color:"var(--dim)",
        marginTop:4, paddingLeft:LABEL_W + 8 }}>
        bars grow from center · red = above avg · blue = below avg
      </div>
    </div>
  );
}

// ── Phase 1 intake gauge ───────────────────────────────────────────────────
function Phase1Gauge({ data, accentColor }) {
  if (!data) return null;
  const { cur_pct, avg_pct, delta_pct, cur_count, sparkline, has_prior } = data;

  const R = 50, CX = 64, CY = 64;
  const toRad = deg => deg * Math.PI / 180;
  const arcPath = (pct, r) => {
    const startAngle = -210;
    const sweep      = 240 * Math.min(pct / 100, 1);
    const endAngle   = startAngle + sweep;
    const x1 = CX + r * Math.cos(toRad(startAngle));
    const y1 = CY + r * Math.sin(toRad(startAngle));
    const x2 = CX + r * Math.cos(toRad(endAngle));
    const y2 = CY + r * Math.sin(toRad(endAngle));
    const large = sweep > 180 ? 1 : 0;
    return sweep > 0
      ? `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)}`
      : '';
  };

  const avgAngle = -210 + 240 * Math.min((avg_pct || 0) / 100, 1);
  const avgX = CX + R * Math.cos(toRad(avgAngle));
  const avgY = CY + R * Math.sin(toRad(avgAngle));

  return (
    <div style={{ display:"flex", gap:16, alignItems:"flex-start" }}>
      {/* Arc gauge */}
      <div style={{ flexShrink:0 }}>
        <svg width={128} height={92} style={{ overflow:"visible" }}>
          <path d={arcPath(100, R)} fill="none"
            stroke="var(--border2)" strokeWidth="7" strokeLinecap="round" />
          <path d={arcPath(cur_pct, R)} fill="none"
            stroke={accentColor} strokeWidth="7" strokeLinecap="round" />
          {has_prior && avg_pct != null && (
            <circle cx={avgX.toFixed(1)} cy={avgY.toFixed(1)} r="5"
              fill="var(--bg)" stroke="#F59E0B" strokeWidth="2" />
          )}
          <text x={CX} y={CY - 4} textAnchor="middle"
            fontSize="20" fontWeight="700" fill={accentColor}
            fontFamily="var(--fm)">
            {cur_pct.toFixed(1)}%
          </text>
          <text x={CX} y={CY + 14} textAnchor="middle"
            fontSize="8" fill="var(--muted)" fontFamily="var(--fm)">
            Phase 1
          </text>
        </svg>
      </div>
      {/* Stats + sparkline */}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:"flex", alignItems:"baseline", gap:6, marginBottom:6 }}>
          <span style={{ fontFamily:"var(--fm)", fontSize:18,
            fontWeight:700, color:accentColor }}>
            {cur_count} trials
          </span>
          {has_prior && delta_pct != null && (
            <span style={{ fontFamily:"var(--fm)", fontSize:11, fontWeight:600,
              color: delta_pct > 1 ? "#EF4444" : delta_pct < -1 ? "#60A5FA" : "var(--muted)" }}>
              {delta_pct > 0 ? "+" : ""}{delta_pct.toFixed(1)}pp vs avg
            </span>
          )}
        </div>
        {has_prior && avg_pct != null && (
          <div style={{ fontFamily:"var(--fm)", fontSize:9,
            color:"var(--dim)", marginBottom:8 }}>
            ● avg {avg_pct.toFixed(1)}%
            <span style={{ marginLeft:8, color:"#F59E0B" }}>○ avg marker on gauge</span>
          </div>
        )}
        {sparkline && (
          <div style={{ marginTop:4 }}>
            <MiniSparkline
              points={sparkline.map(p => ({ ...p, drug_new: p.pct }))}
              accentColor={accentColor}
              width={180} height={58}
              showArea={false} />
          </div>
        )}
      </div>
    </div>
  );
}

function WQ10VelocityDashboard({ data, color }) {
  if (!data?.available) return (
    <div style={{ fontFamily:"var(--fm)", fontSize:12, color:"var(--muted)",
      padding:"20px 0" }}>
      No data — enriched file not loaded or no new drug registrations this window.
    </div>
